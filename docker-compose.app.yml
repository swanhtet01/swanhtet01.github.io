services:
  supermega-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supermega-app
    ports:
      - "8787:8080"
    environment:
      SUPERMEGA_PILOT_DATA: /app/data/pilot-data
      SUPERMEGA_CORS_ORIGINS: http://localhost:8787
      SUPERMEGA_AUTH_REQUIRED: "1"
      SUPERMEGA_APP_USERNAME: owner
      SUPERMEGA_APP_PASSWORD: supermega-demo
      SUPERMEGA_APP_DISPLAY_NAME: Owner
      SUPERMEGA_APP_ROLE: owner
      SUPERMEGA_INTERNAL_CRON_TOKEN: supermega-internal-demo-token
    volumes:
      - supermega-app-data:/app/data
    restart: unless-stopped

# A supermega-supervisor service was removed here. It ran `python -m
# mark1_pilot.supervisor` from this same Dockerfile, but the Dockerfile copies only
# api, supermega_runtime, api_app.py and the built showroom — never mark1_pilot. The
# container could therefore do nothing but ModuleNotFoundError and restart forever,
# next to a healthy supermega-app, which reads as an outage during a demo.
# Restore it by adding `COPY mark1_pilot /app/mark1_pilot` to the Dockerfile first.

volumes:
  supermega-app-data:
