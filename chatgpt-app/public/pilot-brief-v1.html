<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperMega pilot brief</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --paper: #f6f4ee;
        --surface: #fffdf7;
        --ink: #17231d;
        --muted: #5f6c65;
        --line: #d8ddd7;
        --jade: #0b745e;
        --jade-soft: #dcebe5;
        --amber: #a15c18;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        padding: 12px;
      }

      main {
        width: min(100%, 680px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 16px 40px rgba(23, 35, 29, 0.08);
      }

      header {
        display: grid;
        gap: 14px;
        padding: 20px;
        border-bottom: 1px solid var(--line);
        background:
          radial-gradient(circle at 100% 0%, rgba(11, 116, 94, 0.14), transparent 42%),
          var(--surface);
      }

      .brand-row,
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 0.78rem;
        font-weight: 760;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 10px;
        background: var(--ink);
        color: #75dfbd;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: -0.08em;
      }

      .eyebrow,
      .pill {
        color: var(--jade);
        font-size: 0.72rem;
        font-weight: 740;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .pill {
        padding: 6px 9px;
        border: 1px solid rgba(11, 116, 94, 0.22);
        border-radius: 999px;
        background: var(--jade-soft);
        white-space: nowrap;
      }

      h1 {
        margin: 0;
        max-width: 18ch;
        font-size: clamp(1.45rem, 5vw, 2.25rem);
        line-height: 1.02;
        letter-spacing: -0.045em;
      }

      .goal {
        margin: 0;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.55;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        background: var(--line);
        border-bottom: 1px solid var(--line);
      }

      .summary div {
        min-width: 0;
        padding: 13px 16px;
        background: var(--surface);
      }

      .label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 720;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .value {
        display: block;
        overflow: hidden;
        font-size: 0.9rem;
        font-weight: 670;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .content {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(220px, 0.7fr);
        gap: 18px;
        padding: 20px;
      }

      section {
        min-width: 0;
      }

      h2 {
        margin: 0 0 11px;
        font-size: 0.78rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      ol,
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .workflow {
        display: grid;
        gap: 8px;
      }

      .workflow li {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        font-size: 0.88rem;
        font-weight: 640;
      }

      .workflow span {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 8px;
        background: var(--jade-soft);
        color: var(--jade);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
      }

      .checks {
        display: grid;
        gap: 9px;
      }

      .checks li {
        position: relative;
        padding-left: 20px;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .checks li::before {
        position: absolute;
        top: 0.16em;
        left: 0;
        color: var(--jade);
        content: "✓";
        font-weight: 800;
      }

      .boundary {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid rgba(161, 92, 24, 0.22);
        border-radius: 12px;
        background: #fff4e8;
        color: #734313;
        font-size: 0.78rem;
        line-height: 1.45;
      }

      .empty {
        padding: 28px 20px;
        color: var(--muted);
        text-align: center;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 560px) {
        body {
          padding: 0;
        }

        main {
          border-width: 0;
          border-radius: 0;
          box-shadow: none;
        }

        header,
        .content {
          padding: 16px;
        }

        .content {
          grid-template-columns: 1fr;
        }

        .summary {
          grid-template-columns: 1fr 1fr;
        }

        .summary div:last-child {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div id="empty" class="empty">Ask ChatGPT to prepare a SuperMega pilot brief.</div>
      <div id="brief" hidden>
        <header>
          <div class="brand-row">
            <div class="brand"><span class="mark">&gt;_</span> SuperMega</div>
            <span id="mode" class="pill">Draft only</span>
          </div>
          <div>
            <div id="product-status" class="eyebrow"></div>
            <h1 id="title"></h1>
          </div>
          <p id="goal" class="goal"></p>
        </header>

        <div class="summary">
          <div><span class="label">Timeline</span><span id="timeline" class="value"></span></div>
          <div><span class="label">Starting record</span><span id="current-system" class="value"></span></div>
          <div><span class="label">Baseline</span><span id="baseline" class="value"></span></div>
        </div>

        <div class="content">
          <section>
            <h2>Workflow</h2>
            <ol id="workflow" class="workflow"></ol>
          </section>
          <section>
            <h2>Acceptance evidence</h2>
            <ul id="evidence" class="checks"></ul>
            <div class="boundary">
              Human approval remains required for sends, payments, publishing, access changes, and production writes.
            </div>
          </section>
        </div>
      </div>
    </main>

    <script>
      const empty = document.getElementById("empty");
      const brief = document.getElementById("brief");

      function setText(id, value) {
        document.getElementById(id).textContent = String(value ?? "—");
      }

      function renderList(id, values, numbered = false) {
        const list = document.getElementById(id);
        list.replaceChildren();
        (Array.isArray(values) ? values : []).forEach((value, index) => {
          const item = document.createElement("li");
          if (numbered) {
            const number = document.createElement("span");
            number.textContent = String(index + 1).padStart(2, "0");
            item.append(number);
          }
          const text = document.createElement("div");
          text.textContent = String(value);
          item.append(text);
          list.append(item);
        });
      }

      function render(payload) {
        if (!payload || payload.schema_version !== "supermega.pilot-brief.v1") return;
        const product = payload.product || {};
        setText("product-status", `${product.name || "SuperMega"} · ${product.status || "current"}`);
        setText("title", product.template || `${product.name || "SuperMega"} pilot`);
        setText("goal", payload.goal);
        setText("timeline", `${payload.timeline_days} days`);
        setText("current-system", payload.current_system);
        setText("baseline", payload.baseline_measure);
        setText("mode", payload.action_mode === "draft_only" ? "Draft only" : payload.action_mode);
        renderList("workflow", payload.workflow, true);
        renderList("evidence", payload.acceptance_evidence);
        empty.hidden = true;
        brief.hidden = false;
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (message.method !== "ui/notifications/tool-result") return;
          render(message.params?.structuredContent);
        },
        { passive: true },
      );

      render(window.openai?.toolOutput);
    </script>
  </body>
</html>
