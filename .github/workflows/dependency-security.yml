name: Dependency Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Audit ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: platform
            directory: .
          - package: app
            directory: showroom
          - package: kernel
            directory: kernel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=low

  pip-audit:
    name: Audit runtime (pip)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.30'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked audit environment
        run: |
          uv lock --check
          uv sync --frozen --group test --group audit

      - name: Audit locked dependencies
        run: uv run --frozen --group test --group audit pip-audit --local --skip-editable

  required-audits:
    name: Dependency Security Audit
    needs: [npm-audit, pip-audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      NPM_RESULT: ${{ needs.npm-audit.result }}
      PIP_RESULT: ${{ needs.pip-audit.result }}
    steps:
      - name: Require every dependency audit to succeed
        run: node -e "if (process.env.NPM_RESULT !== 'success' || process.env.PIP_RESULT !== 'success') process.exit(1)"
