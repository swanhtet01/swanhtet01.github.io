name: Dependency Security Audit

on:
  # NOTE (2026-08-31): the pull_request trigger is deliberately NOT path-filtered.
  # These audit jobs produce checks that branch protection requires, and a required
  # check only satisfies the rule if it actually REPORTS on the pull request. A
  # path-filtered PR trigger never starts on a pull request that misses the filter, so
  # such a pull request sits at "required status checks are expected" forever, however
  # green it is. Measured on live PRs touching only showroom/, docs/ or hq/.
  #
  # The lockfile list that used to gate the PR trigger is preserved below on push, so
  # a lockfile landing on main is still audited -- that is what the
  # verify_app_deploy_workflow.mjs contract "dependency audit is read-only,
  # scheduled, and covers every npm lockfile" exists to protect. Widening the PR
  # trigger must not cost that coverage.
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'showroom/package.json'
      - 'showroom/package-lock.json'
      - 'kernel/package.json'
      - 'kernel/package-lock.json'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependency-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Audit ${{ matrix.package }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: platform
            directory: .
          - package: app
            directory: showroom
          - package: kernel
            directory: kernel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=low

  pip-audit:
    name: Audit runtime (pip)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit locked dependencies
        run: pip-audit -r requirements-test.txt
