name: Dependency Security Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'showroom/package.json'
      - 'showroom/package-lock.json'
      - 'kernel/package.json'
      - 'kernel/package-lock.json'
      - '.github/workflows/dependency-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Audit ${{ matrix.package }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: platform
            directory: .
          - package: app
            directory: showroom
          - package: kernel
            directory: kernel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit locked dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=low
