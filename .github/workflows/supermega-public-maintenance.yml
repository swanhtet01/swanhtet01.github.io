name: SuperMega Public Maintenance

# No-write public maintenance gate for supermega.dev.
# Uses public HTTP/API checks in CI so scheduled runs do not require Vercel secrets.
on:
  workflow_dispatch:
  schedule:
    # 08:05 Asia/Rangoon daily.
    - cron: '35 1 * * *'

permissions:
  contents: read

jobs:
  public-maintain:
    runs-on: windows-latest
    env:
      SUPERMEGA_PUBLIC_BASE_URL: https://supermega.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run public maintenance gate
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/run_public_go_live_check.ps1 -SkipLeadPost -HttpOnlyAliases

      - name: Upload public screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supermega-public-maintenance-screenshots
          path: output/playwright/*.png
          if-no-files-found: ignore
