name: SuperMega Public - Verified Prebuilt Release

# Keep this definition on main so GitHub registers workflow_dispatch. The
# canonical public branch carries the same file and runs it for every release.
on:
  push:
    branches:
      - codex/public-enterprise-site
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supermega-public-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: team_wI4l7ZgSxcEztQPSlCCYVeJ5
      VERCEL_PROJECT_ID: prj_Yaf0cZYbiFXcLkMcKaAm4alPWMhR

    steps:
      - name: Fetch exact canonical public source
        id: source
        env:
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          if [ -n "$PUSH_SHA" ]; then
            SOURCE_SHA="$PUSH_SHA"
          else
            SOURCE_SHA="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/codex/public-enterprise-site" | awk 'NR == 1 { print $1 }')"
          fi

          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Canonical public source did not resolve to one commit."
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${SOURCE_SHA}" \
            --output "$RUNNER_TEMP/supermega-public-source.tgz"
          tar --extract --gzip \
            --file "$RUNNER_TEMP/supermega-public-source.tgz" \
            --directory "$GITHUB_WORKSPACE" \
            --strip-components=1
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked public build dependencies
        run: npm ci

      - name: Require production deploy credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured for the production environment."
            exit 1
          fi

      - name: Link locked Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify release configuration
        run: npm run vercel:guard

      - name: Generate and verify Build Output API artifact
        run: npm run public:prebuilt

      - name: Deploy verified artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.1.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=${{ steps.source.outputs.sha }}" --meta "githubCommitRef=codex/public-enterprise-site"

      - name: Verify live aliases and first-proof route
        run: npm run public:verify:live
