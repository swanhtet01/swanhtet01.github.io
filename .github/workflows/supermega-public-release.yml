name: SuperMega - Coordinated Verified Release

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character main commit approved for paired production release
        required: true
        type: string
      confirmation:
        description: Type DEPLOY SUPERMEGA PAIRED PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supermega-coordinated-production
  cancel-in-progress: false

jobs:
  verify-deploy-promote:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'swanhtet01/swanhtet01.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      VERCEL_ORG_ID: team_wI4l7ZgSxcEztQPSlCCYVeJ5
      VERCEL_PROJECT_ID: prj_Yaf0cZYbiFXcLkMcKaAm4alPWMhR
      APP_VERCEL_PROJECT_ID: prj_1GAMPH8qlSAXno5BhO1wkYx1jkGG
      PUBLIC_VERCEL_PROJECT_ID: prj_Yaf0cZYbiFXcLkMcKaAm4alPWMhR

    steps:
      - name: Require exact owner release instruction
        env:
          REQUESTED_RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          if ! [[ "$REQUESTED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_commit must be the exact 40-character lowercase commit."
            exit 1
          fi
          if [ "$REQUESTED_RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::release_commit does not match the selected main revision."
            exit 1
          fi
          if [ "$RELEASE_CONFIRMATION" != "DEPLOY SUPERMEGA PAIRED PRODUCTION" ]; then
            echo "::error::paired production confirmation is missing."
            exit 1
          fi
          if [ "$RELEASE_ACTOR" != "swanhtet01" ]; then
            echo "::error::only the repository owner may authorize production promotion."
            exit 1
          fi

      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.30'
          enable-cache: false

      - name: Install migration verifier
        run: npm ci --ignore-scripts

      - name: Verify canonical API and release contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
          python tools/validate_supermega_database_url.py --self-test
          node tools/verify_private_trial_migrations.mjs
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs

      - name: Require production deploy credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured for the production environment."
            exit 1
          fi

      - name: Generate the canonical app deployment contract
        run: node tools/write_app_vercel_config.mjs

      - name: Pull app production build settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Reassert canonical app domain ownership
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.1.0 domains add app.supermega.dev megaos --force --token="$VERCEL_TOKEN"

      - name: Verify app project and select operating mode
        id: app-environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@56.1.0 project inspect megaos --token="$VERCEL_TOKEN"
          npx --yes vercel@56.1.0 api "/v9/projects/$APP_VERCEL_PROJECT_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_project_state.mjs app
          npx --yes vercel@56.1.0 api "/v9/projects/$APP_VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_domain_state.mjs app
          npx --yes vercel@56.1.0 api "/v4/aliases?domain=pos.supermega.dev&teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_retired_vercel_alias_state.mjs pos.supermega.dev
          APP_ENV_AUDIT="$(npx --yes vercel@56.1.0 api "/v10/projects/$APP_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_environment_state.mjs app)"
          printf '%s\n' "$APP_ENV_AUDIT"
          CANDIDATE_MODE="$(printf '%s' "$APP_ENV_AUDIT" | node -e "let input='';process.stdin.on('data',chunk=>input+=chunk);process.stdin.on('end',()=>{const value=JSON.parse(input);if(!['isolated_demo','managed_trial_candidate'].includes(value.operatingMode))process.exit(1);process.stdout.write(value.operatingMode)})")"
          case "$CANDIDATE_MODE" in
            managed_trial_candidate)
              if VALUE_AUDIT="$(npx --yes vercel@56.1.0 env run --environment=production --token="$VERCEL_TOKEN" -- node tools/verify_managed_runtime_environment_values.mjs managed_trial)"; then
                OPERATING_MODE=managed_trial
                RUNTIME_MODE=managed_trial
              else
                VALUE_AUDIT="$(npx --yes vercel@56.1.0 env run --environment=production --token="$VERCEL_TOKEN" -- node tools/verify_managed_runtime_environment_values.mjs staged)"
                OPERATING_MODE=isolated_demo
                RUNTIME_MODE=staged
              fi
              ;;
            isolated_demo)
              VALUE_AUDIT="$(npx --yes vercel@56.1.0 env run --environment=production --token="$VERCEL_TOKEN" -- node tools/verify_managed_runtime_environment_values.mjs isolated_demo)"
              OPERATING_MODE=isolated_demo
              RUNTIME_MODE=isolated_demo
              ;;
          esac
          printf '%s\n' "$VALUE_AUDIT"
          printf 'operating_mode=%s\n' "$OPERATING_MODE" >> "$GITHUB_OUTPUT"
          printf 'runtime_mode=%s\n' "$RUNTIME_MODE" >> "$GITHUB_OUTPUT"

      - name: Enforce exact app runtime database and RLS gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
          SELECTED_RUNTIME_MODE: ${{ steps.app-environment.outputs.runtime_mode }}
        run: |
          case "$SELECTED_RUNTIME_MODE" in
            managed_trial)
              npx --yes vercel@56.1.0 env run --environment=production --token="$VERCEL_TOKEN" -- \
                python tools/validate_supermega_database_url.py --env-key SUPERMEGA_DATABASE_URL --ensure-schema --require-ready
              ;;
            staged)
              echo "Managed credentials are value-verified, but writes remain disabled; production stays isolated_demo while named-user signup is staged."
              ;;
            isolated_demo)
              echo "Managed activation is not selected; production remains isolated_demo."
              ;;
            *)
              echo "::error::Operating mode selection is missing or invalid."
              exit 1
              ;;
          esac

      - name: Build the immutable app artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
          SUPERMEGA_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          npx --yes vercel@56.1.0 env run --environment=production --token="$VERCEL_TOKEN" -- \
            npx --yes vercel@56.1.0 build --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify immutable app asset contract
        run: node tools/verify_app_release_live.mjs --artifact-self-test

      - name: Capture app production rollback target
        id: app-rollback-target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
        run: |
          ROLLBACK_TARGET="$(npx --yes vercel@56.1.0 api "/now/aliases/app.supermega.dev" --raw --token="$VERCEL_TOKEN" | node tools/resolve_vercel_rollback_target.mjs alias app.supermega.dev prj_1GAMPH8qlSAXno5BhO1wkYx1jkGG)"
          read -r PREVIOUS_URL PREVIOUS_ID <<< "$ROLLBACK_TARGET"
          PREVIOUS_URL="$(npx --yes vercel@56.1.0 inspect "$PREVIOUS_URL" --format=json --token="$VERCEL_TOKEN" | node tools/resolve_vercel_rollback_target.mjs deployment "$PREVIOUS_URL" "$PREVIOUS_ID")"
          printf 'url=%s\n' "$PREVIOUS_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated app production candidate
        id: deploy-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
        run: |
          DEPLOYMENT_URL="$(npx --yes vercel@56.1.0 deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=${{ github.sha }}" --meta "githubCommitRef=${{ github.ref_name }}")"
          if ! [[ "$DEPLOYMENT_URL" =~ ^https:// ]]; then
            echo "::error::Vercel did not return an app deployment URL."
            exit 1
          fi
          printf 'url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Inspect and verify app candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
          VERCEL_PROTECTED_PREVIEW: '1'
          APP_BASE_URL: ${{ steps.deploy-app.outputs.url }}
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          EXPECTED_OPERATING_MODE: ${{ steps.app-environment.outputs.operating_mode }}
        run: |
          npx --yes vercel@56.1.0 inspect "$APP_BASE_URL" --token="$VERCEL_TOKEN"
          node tools/verify_app_release_live.mjs

      - name: Link the locked public Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.PUBLIC_VERCEL_PROJECT_ID }}
        run: |
          rm -rf -- .vercel
          npx --yes vercel@56.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Reassert canonical public domain ownership
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@56.1.0 domains add supermega.dev supermega-public --force --token="$VERCEL_TOKEN"
          npx --yes vercel@56.1.0 domains add www.supermega.dev supermega-public --force --token="$VERCEL_TOKEN"

      - name: Verify release authority
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.PUBLIC_VERCEL_PROJECT_ID }}
        run: |
          npm run vercel:guard
          npx --yes vercel@56.1.0 api "/v9/projects/$PUBLIC_VERCEL_PROJECT_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_project_state.mjs public
          npx --yes vercel@56.1.0 api "/v9/projects/$PUBLIC_VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_domain_state.mjs public
          npx --yes vercel@56.1.0 api "/v10/projects/$PUBLIC_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_environment_state.mjs public
          npx --yes vercel@56.1.0 api "/v1/security/firewall/config/active?projectId=$PUBLIC_VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_public_firewall_state.mjs

      - name: Generate and verify the prebuilt artifact
        env:
          SUPERMEGA_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run public:prebuilt

      - name: Capture current production rollback target
        id: rollback-target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.PUBLIC_VERCEL_PROJECT_ID }}
        run: |
          ROLLBACK_TARGET="$(npx --yes vercel@56.1.0 api "/now/aliases/supermega.dev" --raw --token="$VERCEL_TOKEN" | node tools/resolve_vercel_rollback_target.mjs alias supermega.dev prj_Yaf0cZYbiFXcLkMcKaAm4alPWMhR)"
          read -r PREVIOUS_URL PREVIOUS_ID <<< "$ROLLBACK_TARGET"
          PREVIOUS_URL="$(npx --yes vercel@56.1.0 inspect "$PREVIOUS_URL" --format=json --token="$VERCEL_TOKEN" | node tools/resolve_vercel_rollback_target.mjs deployment "$PREVIOUS_URL" "$PREVIOUS_ID")"
          printf 'url=%s\n' "$PREVIOUS_URL" >> "$GITHUB_OUTPUT"

      - name: Verify current two-domain rollback baseline
        env:
          VERIFY_RELEASE_PAIR_ONLY: '1'
        run: node tools/verify_coordinated_release_live.mjs

      - name: Deploy isolated production candidate
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.PUBLIC_VERCEL_PROJECT_ID }}
        run: |
          DEPLOYMENT_URL="$(npx --yes vercel@56.1.0 deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN" --meta "githubCommitSha=${{ github.sha }}" --meta "githubCommitRef=${{ github.ref_name }}")"
          if ! [[ "$DEPLOYMENT_URL" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a public deployment URL."
            exit 1
          fi
          printf 'url=%s\n' "$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Inspect candidate deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.PUBLIC_VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.1.0 inspect "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN"

      - name: Verify protected candidate content
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PUBLIC_BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
        run: node tools/verify_public_preview_live.mjs

      - name: Verify candidate release identity barrier
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROTECTED_PREVIEW: '1'
          APP_BASE_URL: ${{ steps.deploy-app.outputs.url }}
          PUBLIC_BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
        run: node tools/verify_coordinated_release_live.mjs

      - name: Promote the verified app artifact
        id: promote-app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.APP_VERCEL_PROJECT_ID }}
        run: |
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          npx --yes vercel@56.1.0 promote "${{ steps.deploy-app.outputs.url }}" --yes --token="$VERCEL_TOKEN"

      - name: Promote the verified artifact
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ env.PUBLIC_VERCEL_PROJECT_ID }}
        run: |
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          npx --yes vercel@56.1.0 promote "${{ steps.deploy.outputs.url }}" --yes --token="$VERCEL_TOKEN"

      - name: Verify production aliases and exact release
        env:
          APP_BASE_URL: https://app.supermega.dev
          PUBLIC_BASE_URL: https://supermega.dev
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
          EXPECTED_OPERATING_MODE: ${{ steps.app-environment.outputs.operating_mode }}
        run: |
          node tools/verify_app_release_live.mjs
          npm run public:verify:live
          node tools/verify_coordinated_release_live.mjs

      - name: Verify production project controls
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERIFY_DEPLOYED_STATE: '1'
        run: |
          VERCEL_PROJECT_ID="$APP_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v9/projects/$APP_VERCEL_PROJECT_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_project_state.mjs app
          VERCEL_PROJECT_ID="$APP_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v9/projects/$APP_VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_domain_state.mjs app
          VERCEL_PROJECT_ID="$APP_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v4/aliases?domain=pos.supermega.dev&teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_retired_vercel_alias_state.mjs pos.supermega.dev
          VERCEL_PROJECT_ID="$APP_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v10/projects/$APP_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_environment_state.mjs app
          VERCEL_PROJECT_ID="$PUBLIC_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v9/projects/$PUBLIC_VERCEL_PROJECT_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_project_state.mjs public
          VERCEL_PROJECT_ID="$PUBLIC_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v9/projects/$PUBLIC_VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_domain_state.mjs public
          VERCEL_PROJECT_ID="$PUBLIC_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v10/projects/$PUBLIC_VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_vercel_environment_state.mjs public
          VERCEL_PROJECT_ID="$PUBLIC_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 api "/v1/security/firewall/config/active?projectId=$PUBLIC_VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" --raw --token="$VERCEL_TOKEN" | node tools/verify_public_firewall_state.mjs

      - name: Roll back a failed production verification
        if: ${{ failure() && (steps.promote-app.outputs.attempted == 'true' || steps.promote.outputs.attempted == 'true') }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP_PROMOTION_ATTEMPTED: ${{ steps.promote-app.outputs.attempted == 'true' }}
          PUBLIC_PROMOTION_ATTEMPTED: ${{ steps.promote.outputs.attempted == 'true' }}
        run: |
          set +e
          ROLLBACK_FAILED=0
          if [ "$APP_PROMOTION_ATTEMPTED" = "true" ]; then
            VERCEL_PROJECT_ID="$APP_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 rollback "${{ steps.app-rollback-target.outputs.url }}" --yes --token="$VERCEL_TOKEN" || ROLLBACK_FAILED=1
            VERCEL_PROJECT_ID="$APP_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 rollback status megaos --token="$VERCEL_TOKEN" || ROLLBACK_FAILED=1
          fi
          if [ "$PUBLIC_PROMOTION_ATTEMPTED" = "true" ]; then
            VERCEL_PROJECT_ID="$PUBLIC_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 rollback "${{ steps.rollback-target.outputs.url }}" --yes --token="$VERCEL_TOKEN" || ROLLBACK_FAILED=1
            VERCEL_PROJECT_ID="$PUBLIC_VERCEL_PROJECT_ID" npx --yes vercel@56.1.0 rollback status supermega-public --token="$VERCEL_TOKEN" || ROLLBACK_FAILED=1
          fi
          VERIFY_RELEASE_PAIR_ONLY=1 node tools/verify_coordinated_release_live.mjs || ROLLBACK_FAILED=1
          exit "$ROLLBACK_FAILED"
