name: PostgreSQL 17 Windows Evidence Bootstrap

on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Exact reviewed 40-hex commit to test
        required: true
        type: string
      stage:
        description: Non-authoritative capture or separately reviewed rehearsal
        required: true
        type: choice
        options:
          - capture
          - rehearsal

permissions:
  contents: read

concurrency:
  group: postgres17-windows-evidence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      EXACT_SHA: ${{ inputs.exact_sha }}
      DISPATCH_SHA: ${{ github.sha }}
      EVIDENCE_STAGE: ${{ inputs.stage }}
    steps:
      - name: Validate exact SHA input
        shell: pwsh
        run: |
          if ($env:EXACT_SHA -notmatch '^[0-9a-f]{40}$') { throw 'exact_sha_invalid' }
          if ($env:DISPATCH_SHA -ne $env:EXACT_SHA) { throw 'dispatch_ref_not_exact_sha' }
          if ($env:EVIDENCE_STAGE -notin @('capture', 'rehearsal')) { throw 'evidence_stage_invalid' }
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify clean exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXACT_SHA) { throw 'checkout_sha_mismatch' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'checkout_not_clean' }
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - name: Verify source contracts
        shell: pwsh
        run: node --test tools/postgres17_windows_evidence_bootstrap.test.mjs tools/postgres17_toolchain_profile.test.mjs
      - name: Run manual evidence stage
        shell: pwsh
        run: |
          $stage = if ($env:EVIDENCE_STAGE -eq 'capture') { 'Capture' } else { 'Rehearsal' }
          & ./tools/postgres17_windows_evidence_bootstrap.ps1 `
            -Stage $stage `
            -ExactSha $env:EXACT_SHA `
            -RepositoryRoot '${{ github.workspace }}' `
            -OutputDirectory '${{ runner.temp }}\supermega-sanitized-evidence'
      - name: Verify exact sanitized evidence contract
        shell: pwsh
        run: node tools/postgres17_windows_evidence_contract.mjs '${{ runner.temp }}\supermega-sanitized-evidence' $env:EVIDENCE_STAGE $env:EXACT_SHA
      - name: Upload only allowlisted sanitized JSON
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres17-sanitized-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}\supermega-sanitized-evidence\postgres17-stage1-candidate.json
            ${{ runner.temp }}\supermega-sanitized-evidence\postgres17-stage2-cleanup.json
            ${{ runner.temp }}\supermega-sanitized-evidence\postgres17-stage2-closure.json
            ${{ runner.temp }}\supermega-sanitized-evidence\postgres17-rehearsal.json
            ${{ runner.temp }}\supermega-sanitized-evidence\postgres17-rehearsal.json.raw.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false
