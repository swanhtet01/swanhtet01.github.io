name: SuperMega App Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'api_app.py'
      - 'tools/serve_solution.py'
      - 'api/cloud_runtime.py'
      - 'mark1_pilot/**'
      - 'showroom/**'
      - 'tools/write_app_vercel_config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - 'vercel.json'
      - '.github/workflows/supermega-app-deploy.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 'latest'

      - name: Install frontend dependencies
        working-directory: showroom
        run: npm ci

      - name: Generate app deployment configuration
        run: node tools/write_app_vercel_config.mjs

      - name: Verify app project link
        run: npx vercel project inspect megaos --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build app
        run: npm run build

      - name: Build Vercel output
        run: npx vercel build --prod --yes --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy app production
        run: npx vercel deploy --prebuilt --prod --yes --token="${VERCEL_TOKEN}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Smoke free mode
        run: node tools/smoke_free_mode_health.mjs

      - name: Smoke production app
        run: |
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors https://app.supermega.dev/api/health | tee /tmp/supermega-health.json
          if ! jq -e '(.status == "ready") and (.enterprise_db_ready == true) and (.enterprise_db_scheme != "sqlite")' /tmp/supermega-health.json >/dev/null; then
            echo '::error title=Enterprise activation required::The app deployed, but its live health gate is not ready. Provision managed Postgres on the Vercel megaos project, then publish a non-empty data coverage report after the first real workspace source sync.'
            jq '{status, enterprise_db_ready, enterprise_db_scheme, coverage_score, enterprise_activation}' /tmp/supermega-health.json
            exit 1
          fi
