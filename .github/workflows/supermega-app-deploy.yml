name: SuperMega App - Coordinated Release Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - 'api_app.py'
      - 'supermega_runtime/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'supabase/rehearsal/**'
      - 'showroom/**'
      - 'hq/**'
      - 'CURRENT.md'
      - 'site-manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - 'tools/validate_supermega_database_url.py'
      - 'tools/activate_supermega_database.ps1'
      - 'tools/verify_private_storage_privacy.py'
      - 'tools/verify_app_security_contract.mjs'
      - 'tools/rehearse_supermega_postgres17.py'
      - 'tools/run_postgres17_rehearsal.mjs'
      - 'tools/verify_private_trial_migrations.mjs'
      - 'tools/prepare_supabase_rehearsal_packet.mjs'
      - 'tools/prepare_supabase_rehearsal_packet.test.mjs'
      - 'tools/verify_public_browser_quarantine.mjs'
      - 'tools/verify_app_deploy_workflow.mjs'
      - 'tools/supermega_scheduler_authority.json'
      - 'tools/ensure_supermega_scheduler.ps1'
      - 'tools/verify_vercel_project_state.mjs'
      - 'tools/test_vercel_project_state.mjs'
      - 'tools/verify_vercel_environment_state.mjs'
      - 'tools/test_vercel_environment_state.mjs'
      - 'tools/verify_app_release_live.mjs'
      - 'tools/verify_coordinated_release_live.mjs'
      - 'tools/create_public_vercel_output.mjs'
      - 'tools/verify_public_vercel_artifact_budget.mjs'
      - 'tools/verify_public_vercel_output.mjs'
      - 'tools/test_public_contact_function.mjs'
      - 'tools/verify_public_release_live.mjs'
      - 'tools/verify_public_preview_live.mjs'
      - 'tools/verify_vercel_domain_state.mjs'
      - 'tools/verify_retired_vercel_alias_state.mjs'
      - 'tools/test_vercel_domain_state.mjs'
      - 'tools/verify_public_firewall_state.mjs'
      - 'tools/resolve_vercel_rollback_target.mjs'
      - 'tools/deny_stale_public_deploy.mjs'
      - 'tools/deploy_website_actions.ps1'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/supermega-app-deploy.yml'
      - '.github/workflows/showroom-ci.yml'
      - '.github/workflows/supermega-public-release.yml'
      - '.github/workflows/supermega-public-live-health.yml'
      - '.github/workflows/public-hosting-guard.yml'

permissions:
  contents: read

concurrency:
  group: supermega-app-release-guard
  cancel-in-progress: true

jobs:
  validate-coordinated-authority:
    if: ${{ github.repository == 'swanhtet01/swanhtet01.github.io' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify canonical API contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install migration verifier
        run: npm ci --ignore-scripts

      - name: Verify delegated release and RLS guards
        run: |
          npm run database:validator:self-test
          npm run storage:privacy:self-test
          node tools/verify_app_security_contract.mjs
          node tools/verify_private_trial_migrations.mjs
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs

      - name: Confirm this workflow cannot mutate production
        run: echo "Production promotion is owned only by supermega-public-release.yml."
