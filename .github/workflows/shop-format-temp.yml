name: Temporary Shop Stock formatter

on:
  push:
    branches:
      - codex/shop-reorder-threshold-20261022
    paths:
      - '.github/workflows/shop-format-temp.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Format Stock source and widget test
        run: dart format mobile/shop_pos/lib/stock_screen.dart mobile/shop_pos/test/widget_test.dart

      - name: Retain exact formatted files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shop-stock-format-${{ github.sha }}
          path: |
            mobile/shop_pos/lib/stock_screen.dart
            mobile/shop_pos/test/widget_test.dart
          if-no-files-found: error
          retention-days: 2
