name: Temporary Shop Drift v9 generator

on:
  push:
    branches:
      - codex/shop-reorder-threshold-20261022
    paths:
      - 'mobile/shop_pos/**'
      - '.github/workflows/shop-drift-generate-temp.yml'

permissions:
  contents: read

concurrency:
  group: shop-drift-v9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        working-directory: mobile/shop_pos
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart source and tests
        working-directory: mobile/shop_pos
        run: dart format lib/shop_database.dart lib/shop_backup.dart lib/shop_today_screen.dart lib/stock_screen.dart test/shop_backup_test.dart test/shop_foundation_test.dart test/widget_test.dart

      - name: Generate Drift source
        working-directory: mobile/shop_pos
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Confirm lockfile is unchanged
        run: git diff --exit-code -- mobile/shop_pos/pubspec.lock

      - name: Retain exact generated and formatted sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shop-drift-v9-${{ github.sha }}
          path: |
            mobile/shop_pos/lib/shop_database.dart
            mobile/shop_pos/lib/shop_database.g.dart
            mobile/shop_pos/lib/shop_backup.dart
            mobile/shop_pos/lib/shop_today_screen.dart
            mobile/shop_pos/lib/stock_screen.dart
            mobile/shop_pos/test/shop_backup_test.dart
            mobile/shop_pos/test/shop_foundation_test.dart
            mobile/shop_pos/test/widget_test.dart
          if-no-files-found: error
          retention-days: 7

      - name: Analyze Flutter source
        working-directory: mobile/shop_pos
        run: flutter analyze

      - name: Run focused Shop tests
        working-directory: mobile/shop_pos
        run: flutter test test/shop_backup_test.dart test/shop_foundation_test.dart test/widget_test.dart --concurrency=1 --reporter expanded
