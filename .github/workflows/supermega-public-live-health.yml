name: SuperMega Public Live Health

on:
  workflow_run:
    workflows:
      - SuperMega - Coordinated Verified Release
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '45 1 * * *'

permissions:
  contents: read

concurrency:
  group: supermega-public-live-health
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify current public release
        env:
          PUBLIC_BASE_URL: https://supermega.dev
          EXPECTED_RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || '' }}
        run: npm run public:verify:live
