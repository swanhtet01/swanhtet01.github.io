name: SuperMega Public Live Health

# Default-branch, read-only production monitor. The public release itself is
# owned by codex/public-enterprise-site; this workflow only checks live truth.
on:
  workflow_dispatch:
  schedule:
    # 08:15 Asia/Rangoon daily.
    - cron: '45 1 * * *'

permissions:
  contents: read

concurrency:
  group: supermega-public-live-health
  cancel-in-progress: true

jobs:
  live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check current public funnel
        run: python tools/check_public_live_health.py
