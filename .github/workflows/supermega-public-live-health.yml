name: SuperMega Public Live Health

on:
  workflow_run:
    workflows:
      - SuperMega Public - Verified Prebuilt Release
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '45 1 * * *'

permissions:
  contents: read

concurrency:
  group: supermega-public-live-health
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current release contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Verify current public release
        env:
          PUBLIC_BASE_URL: https://supermega.dev
          EXPECTED_RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || '' }}
        run: npm run public:verify:live
