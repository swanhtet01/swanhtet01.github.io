              ANDROID_USER_HOME="$ANDROID_USER_HOME" ANDROID_SDK_HOME="$ANDROID_SDK_HOME" \
              ANDROID_EMULATOR_HOME="$ANDROID_EMULATOR_HOME" ANDROID_AVD_HOME="$ANDROID_AVD_HOME" \
              XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
              XDG_DATA_HOME="$XDG_DATA_HOME" TMPDIR="$TMPDIR" \
