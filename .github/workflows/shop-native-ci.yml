          def main():
              os.umask(0o077)
              require(license_marker_matches())
              cpu = os.cpu_count()
              require(isinstance(cpu, int) and cpu >= 4)
              pages = os.sysconf('SC_PHYS_PAGES')
              page_size = os.sysconf('SC_PAGE_SIZE')
              require(all(isinstance(value, int) and 0 < value < 10 ** 15
                          for value in (pages, page_size)))
              require(pages * page_size >= 8 * GIB)
              require(shutil.disk_usage(WORK).free >= 8 * GIB)
