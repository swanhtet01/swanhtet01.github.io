          import hashlib
          import os
          import shutil
          import ssl
          import stat
          import sys
          import urllib.request
          import zipfile
          from pathlib import Path

          URL = 'https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip'
          SIZE = 349658551
          SHA1 = 'f41f9e31eb5ca64926603c03265c50bbc0ff4172'
          LICENSE_HASH = b'24333f8a63b6825ea9c5514f83c2829b004d1fee'
          GIB = 1024 ** 3
          WORK = Path(sys.argv[1])
          SDK = WORK / 'sdk'
          ARCHIVE = WORK / 'emulator.zip'

          def require(condition):
              if not condition:
                  raise ValueError('pinned_emulator_check_failed')

          def license_marker_matches():
