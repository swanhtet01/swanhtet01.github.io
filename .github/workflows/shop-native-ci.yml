name: Shop native POS checks

on:
  pull_request:
    paths:
      - "mobile/shop_pos/**"
      - ".github/workflows/shop-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify pinned native toolchain contract
        working-directory: ${{ github.workspace }}
        run: npm run shop:native:ci-contract:verify

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check changed Dart formatting
        run: |
          dart format lib/camera_barcode_scanner.dart lib/connected_orders_screen.dart lib/connected_orders_service.dart lib/main.dart lib/menu_import_screen.dart lib/menu_import_service.dart lib/printer_services.dart lib/printer_setup_screen.dart lib/recent_sales_screen.dart lib/shop_backup.dart lib/shop_backup_export_screen.dart lib/shop_build_identity.g.dart lib/shop_cash_shift_screen.dart lib/shop_copy.dart lib/shop_correction_authorization_service.dart lib/shop_correction_receipt.dart lib/shop_database.dart lib/shop_operational_export.dart lib/shop_operational_export_saver.dart lib/shop_runtime_profile.dart lib/shop_runtime_scope.dart lib/shop_sale_correction_dialog.dart lib/shop_startup.dart lib/shop_today_screen.dart lib/stock_screen.dart test/shop_backup_test.dart test/shop_correction_authorization_service_test.dart test/shop_foundation_test.dart test/shop_member_identity_test.dart test/shop_operational_export_database_test.dart test/shop_operational_export_saver_test.dart test/shop_operational_export_test.dart test/shop_operational_export_widget_test.dart test/shop_runtime_profile_test.dart test/shop_runtime_scope_test.dart test/visual_capture_test.dart test/widget_test.dart
          git diff --exit-code -- lib/camera_barcode_scanner.dart lib/connected_orders_screen.dart lib/connected_orders_service.dart lib/main.dart lib/menu_import_screen.dart lib/menu_import_service.dart lib/printer_services.dart lib/printer_setup_screen.dart lib/recent_sales_screen.dart lib/shop_backup.dart lib/shop_backup_export_screen.dart lib/shop_build_identity.g.dart lib/shop_cash_shift_screen.dart lib/shop_copy.dart lib/shop_correction_authorization_service.dart lib/shop_correction_receipt.dart lib/shop_database.dart lib/shop_operational_export.dart lib/shop_operational_export_saver.dart lib/shop_runtime_profile.dart lib/shop_runtime_scope.dart lib/shop_sale_correction_dialog.dart lib/shop_startup.dart lib/shop_today_screen.dart lib/stock_screen.dart test/shop_backup_test.dart test/shop_correction_authorization_service_test.dart test/shop_foundation_test.dart test/shop_member_identity_test.dart test/shop_operational_export_database_test.dart test/shop_operational_export_saver_test.dart test/shop_operational_export_test.dart test/shop_operational_export_widget_test.dart test/shop_runtime_profile_test.dart test/shop_runtime_scope_test.dart test/visual_capture_test.dart test/widget_test.dart

      - name: Check first-sale widget in isolation
        run: timeout --signal=TERM --kill-after=10s 90s flutter test test/widget_test.dart --plain-name 'empty catalog can make a durable cash sale' --reporter expanded --timeout 60s

      - name: Check first-run restore in isolation
        run: timeout --signal=TERM --kill-after=10s 60s flutter test test/shop_backup_test.dart --plain-name 'fresh install restores before Shop opens' --reporter expanded --timeout 45s

      - name: Verify Flutter test shard inventory
        run: |
          find test -maxdepth 1 -type f -name '*_test.dart' -printf '%p\n' | sort > /tmp/shop-test-files.actual
          cat > /tmp/shop-test-files.expected <<'EOF'
          test/connected_orders_test.dart
          test/shop_backup_test.dart
          test/shop_correction_authorization_service_test.dart
          test/shop_correction_consumption_test.dart
          test/shop_foundation_test.dart
          test/shop_member_identity_test.dart
          test/shop_operational_export_database_test.dart
          test/shop_operational_export_saver_test.dart
          test/shop_operational_export_test.dart
          test/shop_operational_export_widget_test.dart
          test/shop_runtime_profile_test.dart
          test/shop_runtime_scope_test.dart
          test/visual_capture_test.dart
          test/widget_test.dart
          EOF
          diff -u /tmp/shop-test-files.expected /tmp/shop-test-files.actual

      - name: Run Flutter behavior tests
        run: |
          timeout --signal=TERM --kill-after=10s 180s flutter test --concurrency=1 --reporter expanded --timeout 2m \
            test/connected_orders_test.dart \
            test/shop_correction_authorization_service_test.dart \
            test/shop_foundation_test.dart \
            test/shop_operational_export_saver_test.dart \
            test/shop_operational_export_test.dart \
            test/shop_operational_export_widget_test.dart \
            test/shop_runtime_profile_test.dart \
            test/shop_runtime_scope_test.dart \
            test/widget_test.dart

      - name: Run Flutter persistence tests
        run: |
          timeout --signal=TERM --kill-after=10s 180s flutter test --concurrency=1 --reporter expanded --timeout 2m \
            test/shop_backup_test.dart \
            test/shop_correction_consumption_test.dart \
            test/shop_member_identity_test.dart \
            test/shop_operational_export_database_test.dart \
            test/visual_capture_test.dart

      - name: Generate Android production identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform android --profile production

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Capture synthetic Flutter screens with bundled fonts
        env:
          SHOP_VISUAL_CAPTURE: "1"
        run: |
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          export SHOP_MATERIAL_ICONS_FONT="$(dirname "$flutter_bin")/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -f "$SHOP_MATERIAL_ICONS_FONT"
          timeout --signal=TERM --kill-after=10s 180s flutter test test/visual_capture_test.dart --update-goldens --reporter expanded --timeout 60s

      - name: Retain Flutter-rendered screens for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-flutter-renders-${{ github.sha }}
          path: mobile/shop_pos/test/goldens/shop_*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Reject unsigned Android release packaging
        run: |
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_KEYSTORE_PATH
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_KEY_ALIAS
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_STORE_PASSWORD
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_KEY_PASSWORD
          cleanup_release_outputs() {
            release_files="$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-production-release*.apk' -print 2>/dev/null)"
            if [ -n "$release_files" ]; then
              rm -f build/app/outputs/flutter-apk/app-production-release*.apk
              return 1
            fi
          }
          trap 'result=$?; cleanup_release_outputs || result=1; trap - EXIT; exit "$result"' EXIT
          rm -f build/app/outputs/flutter-apk/app-production-release*.apk
          set +e
          release_output="$(flutter build apk --release --no-pub --flavor production 2>&1)"
          release_status=$?
          set -e
          test "$release_status" -ne 0
          printf '%s\n' "$release_output" | grep -F 'shop_android_release_signing_unavailable'
          test -z "$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-production-release*.apk' -print -quit 2>/dev/null)"
          set +e
          aggregate_output="$(cd android && ./gradlew assembleProductionRelease --console=plain 2>&1)"
          aggregate_status=$?
          set -e
          test "$aggregate_status" -ne 0
          printf '%s\n' "$aggregate_output" | grep -F 'shop_android_release_signing_unavailable'
          test -z "$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-production-release*.apk' -print -quit 2>/dev/null)"

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --flavor production

      - name: Record Android debug APK checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-production-debug.apk > app-production-debug.apk.sha256
          sha256sum --check app-production-debug.apk.sha256

      - name: Retain Android debug APK for device QA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-android-production-debug-${{ github.sha }}
          path: |
            mobile/shop_pos/build/app/outputs/flutter-apk/app-production-debug.apk
            mobile/shop_pos/build/app/outputs/flutter-apk/app-production-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build iPad/iOS app
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate iOS production identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform ios --profile production

      - name: Build iOS app without signing
        run: flutter build ios --debug --no-codesign --no-pub

  windows:
    name: Build Windows PC app
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Generate Windows runner without touching the app lockfile
        shell: pwsh
        run: |
          $lockBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath 'pubspec.lock').Hash
          $runnerSource = Join-Path $env:RUNNER_TEMP 'supermega_shop_windows_runner'
          flutter create --platforms=windows --no-pub --project-name supermega_shop $runnerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $runnerSource 'windows') -Destination 'windows' -Recurse
          & .\scripts\build_windows_icon.ps1
          $lockAfter = (Get-FileHash -Algorithm SHA256 -LiteralPath 'pubspec.lock').Hash
          if ($lockBefore -ne $lockAfter) { throw 'Windows runner generation changed the committed pubspec.lock.' }

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Windows production identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform windows --profile production

      - name: Prove backup restore and no-replace behavior on Windows
        run: flutter test test/shop_backup_test.dart --reporter expanded --timeout 2m

      - name: Build unsigned Windows app
        run: flutter build windows --release --no-pub

      - name: Package complete Windows app for device QA
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path -LiteralPath $releaseDir)) { throw 'Windows release directory is missing.' }
          $packagePath = 'build/supermega-shop-windows-unsigned.zip'
          $checksumPath = "$packagePath.sha256"
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $packagePath
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagePath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$checksum  supermega-shop-windows-unsigned.zip" -Encoding ascii
          if (-not (Test-Path -LiteralPath $checksumPath)) { throw 'Windows package checksum is missing.' }
          $recordedChecksum = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expectedChecksum = "$checksum  supermega-shop-windows-unsigned.zip"
          if ($recordedChecksum -cne $expectedChecksum) { throw 'Windows package checksum verification failed.' }

      - name: Retain Windows QA package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-windows-unsigned-${{ github.sha }}
          path: |
            mobile/shop_pos/build/supermega-shop-windows-unsigned.zip
            mobile/shop_pos/build/supermega-shop-windows-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14

  android-qa:
    name: Build isolated Android synthetic QA app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Android QA identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform android --profile synthetic_qa_v1

      - name: Build Android QA
        run: flutter build apk --debug --no-pub --flavor qa --dart-define=SHOP_RUNTIME_PROFILE=synthetic_qa_v1 --dart-define=SHOP_QA_PROFILE_ID=synthetic-qa-v1

      - name: Stage Android QA artifact
        run: cp build/app/outputs/flutter-apk/app-qa-debug.apk "${{ github.workspace }}/app-qa-debug.apk"

      - name: Inspect Android QA identity
        working-directory: ${{ github.workspace }}
        run: |
          analyzer="$(command -v apkanalyzer)"
          test -n "$analyzer"
          test "$("$analyzer" manifest application-id app-qa-debug.apk)" = 'dev.supermega.supermega_shop.qa'
          "$analyzer" manifest print app-qa-debug.apk | grep -F 'android:label="Shop QA"'

      - name: Hash Android QA artifact
        working-directory: ${{ github.workspace }}
        run: sha256sum app-qa-debug.apk > app-qa-debug.apk.sha256

      - name: Bind Android QA artifact to source
        working-directory: ${{ github.workspace }}
        run: echo "source-sha=${{ github.sha }} sha-256=$(cat app-qa-debug.apk.sha256) promotion-ineligible" > app-qa-debug.apk.manifest

      - name: Upload promotion-ineligible Android QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-promotion-ineligible-${{ github.sha }}-sha-256-android
          path: |
            app-qa-debug.apk
            app-qa-debug.apk.sha256
            app-qa-debug.apk.manifest
          if-no-files-found: error
          retention-days: 7

  ios-qa:
    name: Build isolated iOS synthetic QA app
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate iOS QA identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform ios --profile synthetic_qa_v1

      - name: Build iOS QA
        run: flutter build ios --debug --no-codesign --no-pub --flavor qa --dart-define=SHOP_RUNTIME_PROFILE=synthetic_qa_v1 --dart-define=SHOP_QA_PROFILE_ID=synthetic-qa-v1

      - name: Stage iOS QA artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "${{ github.workspace }}/Runner.app.zip"

      - name: Inspect iOS QA identity
        run: |
          info='build/ios/iphoneos/Runner.app/Info.plist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'dev.supermega.supermegaShop.qa'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")" = 'Shop QA'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$info")" = 'Shop QA'

      - name: Hash iOS QA artifact
        working-directory: ${{ github.workspace }}
        run: shasum -a 256 Runner.app.zip > Runner.app.zip.sha256

      - name: Bind iOS QA artifact to source
        working-directory: ${{ github.workspace }}
        run: echo "source-sha=${{ github.sha }} sha-256=$(cat Runner.app.zip.sha256) promotion-ineligible" > Runner.app.zip.manifest

      - name: Upload promotion-ineligible iOS QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-promotion-ineligible-${{ github.sha }}-sha-256-ios
          path: |
            Runner.app.zip
            Runner.app.zip.sha256
            Runner.app.zip.manifest
          if-no-files-found: error
          retention-days: 7

  windows-qa:
    name: Build isolated Windows synthetic QA app
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Generate Windows runner
        run: |
          $runnerSource = Join-Path $env:RUNNER_TEMP 'supermega_shop_windows_qa_runner'
          flutter create --platforms=windows --no-pub --project-name supermega_shop $runnerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $runnerSource 'windows') -Destination 'windows' -Recurse

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Windows QA identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform windows --profile synthetic_qa_v1

      - name: Configure Windows QA runner
        run: .\scripts\configure_windows_qa_runner.ps1

      - name: Build Windows QA
        run: flutter build windows --release --no-pub --dart-define=SHOP_RUNTIME_PROFILE=synthetic_qa_v1 --dart-define=SHOP_QA_PROFILE_ID=synthetic-qa-v1

      - name: Inspect Windows QA identity
        run: |
          $executable = 'build\windows\x64\runner\Release\supermega_shop_qa.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'shop_windows_qa_executable_missing' }
          $identity = (Get-Item -LiteralPath $executable).VersionInfo
          if ($identity.ProductName -cne 'Shop QA' -or
              $identity.FileDescription -cne 'Shop QA' -or
              $identity.InternalName -cne 'supermega_shop_qa' -or
              $identity.OriginalFilename -cne 'supermega_shop_qa.exe') {
            throw 'shop_windows_qa_built_identity_mismatch'
          }

      - name: Package full Windows QA runtime
        run: |
          $releaseDirectory = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $packagePath = Join-Path $env:GITHUB_WORKSPACE 'supermega-shop-windows-qa.zip'
          Compress-Archive -Path $releaseDirectory -DestinationPath $packagePath -CompressionLevel Optimal

      - name: Hash and verify Windows QA package
        working-directory: ${{ github.workspace }}
        run: |
          $artifact = 'supermega-shop-windows-qa.zip'
          $checksumPath = "$artifact.sha256"
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
          "$digest  $artifact" | Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          $expected = "$((Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant())  $artifact"
          $recorded = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($recorded -cne $expected) { throw 'shop_windows_qa_checksum_mismatch' }

      - name: Bind Windows QA artifact to source
        working-directory: ${{ github.workspace }}
        run: Write-Output "source-sha=${{ github.sha }} sha-256=$(Get-Content supermega-shop-windows-qa.zip.sha256) promotion-ineligible" | Out-File supermega-shop-windows-qa.zip.manifest

      - name: Upload promotion-ineligible Windows QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-promotion-ineligible-${{ github.sha }}-sha-256-windows
          path: |
            supermega-shop-windows-qa.zip
            supermega-shop-windows-qa.zip.sha256
            supermega-shop-windows-qa.zip.manifest
          if-no-files-found: error
          retention-days: 7
