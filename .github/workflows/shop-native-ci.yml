          offline_emulator -version > "$task_dir/version.out" 2>&1 || version_rc=$?
          if (( version_rc != 0 )); then
            printf 'emulator_version_attempt_exit=%s\n' "$version_rc"
            "$python_bin" -I -B - "$task_dir/version.out" "$emulator_bin" <<'PYVERSION'
          import os
          import re
          import stat
          import sys

          MAX = 65536
          stage = 'before_exec_attempt'
          hint = 'unclassified'
          soname = 'none'
          shared_line_shape = 'none'
          shared_prefix_form = 'none'
          shared_payload_shape = 'none'

          def package_executable(raw_prefix, binary):
              try:
                  root = os.path.dirname(binary)
                  candidate = os.fsdecode(raw_prefix)
                  if (not os.path.isabs(candidate) or
                          root != os.path.realpath(root) or
                          candidate != os.path.normpath(candidate) or
                          candidate != os.path.realpath(candidate) or
                          os.path.commonpath((root, candidate)) != root or
                          candidate == root):
                      return False
                  parts = candidate[len(root) + 1:].split(os.sep)
                  if not parts or any(part in ('', '.', '..') for part in parts):
                      return False
                  current = root
                  for part in parts[:-1]:
                      current = os.path.join(current, part)
                      if not stat.S_ISDIR(os.lstat(current).st_mode):
                          return False
                  file_info = os.lstat(candidate)
                  return stat.S_ISREG(file_info.st_mode) and bool(file_info.st_mode & 0o111)
              except (OSError, ValueError):
                  return False

          try:
              fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_size > MAX:
                      raise ValueError('unavailable')
                  data = os.read(fd, MAX + 1)
                  if len(data) > MAX:
                      raise ValueError('unavailable')
              finally:
                  os.close(fd)
              lines = data.splitlines()
              marker = b'__SM_EMULATOR_EXEC_ATTEMPT__'
              marker_positions = [index for index, line in enumerate(lines) if line == marker]
              if len(marker_positions) == 1:
                  stage = 'exec_attempt_reached'
              elif marker_positions:
                  stage = 'exec_attempt_ambiguous'
              binary = sys.argv[2]
              binary_bytes = os.fsencode(binary)
              delimiter = b': error while loading shared libraries: '
              suffix = b': cannot open shared object file: No such file or directory'
              valid_name = re.compile(rb'lib[A-Za-z0-9_+.-]{1,42}\.so(?:\.[0-9]{1,4}){0,3}')
              categories = set()
              shared_lines = 0
              observed_name = None
              for index, line in enumerate(lines):
                  if line == marker:
                      continue
                  if len(line) > 1024:
                      categories.add('oversize_line')
                      continue
                  lower = line.lower()
                  if b'error while loading shared libraries:' in lower:
                      categories.add('shared_library')
                      shared_lines += 1
                      if shared_lines > 1:
                          shared_line_shape = 'multiple_lines'
                      else:
                          if line.count(delimiter) != 1:
                              shared_payload_shape = 'delimiter_mismatch'
                          else:
                              raw_prefix, raw_payload = line.split(delimiter, 1)
                              if raw_prefix == binary_bytes:
                                  shared_prefix_form = 'direct_emulator'
                              elif raw_prefix == os.path.basename(binary_bytes):
                                  shared_prefix_form = 'basename_only'
                              elif package_executable(raw_prefix, binary):
                                  shared_prefix_form = 'package_executable'
                              else:
                                  shared_prefix_form = 'unrecognized'
                              if not raw_payload.endswith(suffix):
                                  shared_payload_shape = 'suffix_mismatch'
                              else:
                                  name = raw_payload[:-len(suffix)]
                                  if valid_name.fullmatch(name) and b'..' not in name:
                                      shared_payload_shape = 'valid_name'
                                      observed_name = name.decode('ascii')
                                  else:
                                      shared_payload_shape = 'invalid_name'
                          if len(marker_positions) != 1:
                              shared_line_shape = 'marker_mismatch'
                          elif index < marker_positions[0]:
                              shared_line_shape = 'before_marker'
                          elif shared_prefix_form not in ('direct_emulator', 'package_executable'):
                              shared_line_shape = 'prefix_mismatch'
                          elif shared_payload_shape == 'valid_name':
                              shared_line_shape = 'recognized'
                          else:
                              shared_line_shape = shared_payload_shape
                      continue
                  if b'no such file or directory' in lower or b'not found' in lower:
                      categories.add('missing_file_or_loader')
                  elif b'permission denied' in lower or b'operation not permitted' in lower:
                      categories.add('permission')
                  elif b'segmentation fault' in lower or b'aborted' in lower:
                      categories.add('process_abort')
              if len(categories) > 1:
                  hint = 'mixed_distinct'
              elif categories == {'shared_library'}:
                  hint = 'shared_library'
                  if (stage == 'exec_attempt_reached' and shared_lines == 1 and
                          shared_line_shape == 'recognized' and observed_name):
                      soname = observed_name
                  else:
                      hint = 'shared_library_unidentified'
              elif categories:
                  hint = categories.pop()
          except (OSError, ValueError):
              stage = 'unavailable'
              hint = 'unavailable'
              soname = 'none'
              shared_line_shape = 'unavailable'
              shared_prefix_form = 'unavailable'
              shared_payload_shape = 'unavailable'
          print('emulator_version_stage=' + stage)
          print('emulator_version_output_hint=' + hint)
          print('emulator_version_observed_missing_soname=' + soname)
          print('emulator_version_observed_shared_line_shape=' + shared_line_shape)
          print('emulator_version_observed_shared_prefix_form=' + shared_prefix_form)
          print('emulator_version_observed_shared_payload_shape=' + shared_payload_shape)
          PYVERSION
            echo 'pinned emulator version attempt failed'
            exit 1
          fi
          [[ "$("$stat_bin" -Lc '%d:%i:%a:%u:%g' "$passwd_home")" == "$host_home_identity" ]] || {
            echo 'runner home mount identity changed after version check'
            exit 1
          }
          grep -Eq 'Android emulator version 37[.]2[.]13([.]0)?([^0-9.]|$)' "$task_dir/version.out" || {
            echo 'emulator binary version does not match pinned package'
            exit 1
          }

          getfacl -p /dev/kvm > "$task_dir/acl.before"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            getfacl -ncp /dev/kvm > "$task_dir/acl.numeric"
            acl_scan=0
            grep -Eq '^(user:[0-9]+:|group:[0-9]+:|mask::)' "$task_dir/acl.numeric" || acl_scan=$?
            [[ "$acl_scan" == 1 ]] || { echo 'KVM ACL extended or inspection failed'; exit 1; }
            acl_changed=true
            sudo -n setfacl -m "u:$(id -u):rw" /dev/kvm
            [[ -r /dev/kvm && -w /dev/kvm ]] || { echo 'runner-user KVM access failed'; exit 1; }
          fi
          python3 - <<'PYKVM'
          import fcntl
          import os
          fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
          try:
              if fcntl.ioctl(fd, 0xAE00, 0) != 12:
                  raise SystemExit('unsupported KVM API version')
          finally:
              os.close(fd)
          PYKVM
          if ! offline_emulator -accel-check > "$task_dir/accel.out" 2>&1; then
            echo 'emulator acceleration check command failed'
            exit 1
          fi
          [[ "$("$stat_bin" -Lc '%d:%i:%a:%u:%g' "$passwd_home")" == "$host_home_identity" ]] || {
            echo 'runner home mount identity changed after acceleration check'
            exit 1
          }
          grep -Eq 'KVM.*is installed and usable' "$task_dir/accel.out" || {
            echo 'emulator acceleration was not reported usable'
            exit 1
          }
          echo 'Pinned emulator 37.2.13 acceleration PASS; no AVD, APK or app ran'
