                  source = opened[-1]
                  details = os.fstat(source)
                  if not stat.S_ISREG(details.st_mode) or details.st_size > 4096:
                      return False
                  data = os.read(source, 4097)
                  if len(data) > 4096 or os.read(source, 1):
