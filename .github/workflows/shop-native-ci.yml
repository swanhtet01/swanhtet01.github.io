          export ANDROID_SDK_ROOT="$task_dir/sdk"
          export ANDROID_HOME="$task_dir/sdk"
          export ANDROID_USER_HOME="$task_dir/android-user"
          export ANDROID_SDK_HOME="$task_dir/android-sdk-home"
