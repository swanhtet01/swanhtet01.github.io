          # Google's feed supplies SHA-1; observed SHA-256 is recorded only after download.
          for tool in python3 getfacl setfacl sudo timeout grep cmp unshare setpriv env id tr mount mountpoint stat; do
            command -v "$tool" >/dev/null || { echo "required host tool absent: $tool"; exit 1; }
          done
