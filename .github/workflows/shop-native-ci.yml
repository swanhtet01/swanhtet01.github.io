name: Shop native POS checks

on:
  pull_request:
    paths:
      - "mobile/shop_pos/**"
      - ".github/workflows/shop-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check changed Dart formatting
        run: |
          dart format lib/main.dart lib/menu_import_screen.dart lib/menu_import_service.dart lib/printer_services.dart lib/recent_sales_screen.dart lib/shop_copy.dart lib/shop_database.dart lib/stock_screen.dart test/shop_foundation_test.dart test/widget_test.dart
          git diff --exit-code -- lib/main.dart lib/menu_import_screen.dart lib/menu_import_service.dart lib/printer_services.dart lib/recent_sales_screen.dart lib/shop_copy.dart lib/shop_database.dart lib/stock_screen.dart test/shop_foundation_test.dart test/widget_test.dart

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded --timeout 2m

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Retain Android debug APK for device QA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-android-debug-${{ github.sha }}
          path: mobile/shop_pos/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: Build iPad/iOS app
    needs: android
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS app without signing
        run: flutter build ios --debug --no-codesign --no-pub

  windows:
    name: Build Windows PC app
    needs: android
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner without touching the app lockfile
        shell: pwsh
        run: |
          $lockBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath 'pubspec.lock').Hash
          $runnerSource = Join-Path $env:RUNNER_TEMP 'supermega_shop_windows_runner'
          flutter create --platforms=windows --no-pub --project-name supermega_shop $runnerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $runnerSource 'windows') -Destination 'windows' -Recurse
          $lockAfter = (Get-FileHash -Algorithm SHA256 -LiteralPath 'pubspec.lock').Hash
          if ($lockBefore -ne $lockAfter) { throw 'Windows runner generation changed the committed pubspec.lock.' }

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned Windows app
        run: flutter build windows --release --no-pub

      - name: Package complete Windows app for device QA
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path -LiteralPath $releaseDir)) { throw 'Windows release directory is missing.' }
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath 'build/supermega-shop-windows-unsigned.zip'

      - name: Retain Windows QA package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-windows-unsigned-${{ github.sha }}
          path: mobile/shop_pos/build/supermega-shop-windows-unsigned.zip
          if-no-files-found: error
          retention-days: 7
