name: Shop native POS checks

on:
  pull_request:
    paths:
      - "mobile/shop_pos/**"
      - ".github/workflows/shop-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SHOP_FLUTTER_TEST_SHARD_BUDGET_SECONDS: "600"
      SHOP_FLUTTER_TEST_TOTAL_BUDGET_SECONDS: "5400"
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify pinned native toolchain contract
        working-directory: ${{ github.workspace }}
        run: npm run shop:native:ci-contract:verify

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check changed Dart formatting
        run: |
          dart format lib/camera_barcode_scanner.dart lib/connected_orders_screen.dart lib/connected_orders_service.dart lib/main.dart lib/menu_import_screen.dart lib/menu_import_service.dart lib/printer_services.dart lib/printer_setup_screen.dart lib/recent_sales_screen.dart lib/shop_backup.dart lib/shop_backup_export_screen.dart lib/shop_build_identity.g.dart lib/shop_cafe_kitchen_entitlement.dart lib/shop_cafe_order_contract.dart lib/shop_cafe_order_screen.dart lib/shop_cafe_order_store.dart lib/shop_cash_shift_screen.dart lib/shop_catalog_search.dart lib/shop_copy.dart lib/shop_correction_authorization_service.dart lib/shop_correction_consumption.dart lib/shop_correction_receipt.dart lib/shop_database.dart lib/shop_operational_export.dart lib/shop_operational_export_saver.dart lib/shop_qa_evidence_store.dart lib/shop_runtime_profile.dart lib/shop_runtime_scope.dart lib/shop_sale_correction_dialog.dart lib/shop_staff_authorization.dart lib/shop_startup.dart lib/shop_today_screen.dart lib/stock_screen.dart test/shop_add_product_test.dart test/shop_backup_test.dart test/shop_cafe_kitchen_entitlement_test.dart test/shop_cafe_order_contract_test.dart test/shop_cafe_order_screen_test.dart test/shop_cafe_order_store_test.dart test/shop_cafe_table_kitchen_test.dart test/shop_cash_movement_test.dart test/shop_catalog_search_test.dart test/shop_core_internal_acceptance_test.dart test/shop_correction_authorization_service_test.dart test/shop_foundation_test.dart test/shop_member_identity_test.dart test/shop_mmk_input_test.dart test/shop_operational_export_database_test.dart test/shop_operational_export_saver_test.dart test/shop_operational_export_test.dart test/shop_operational_export_widget_test.dart test/shop_pending_cash_checkout_test.dart test/shop_process_interrupt_worker_test.dart test/shop_qa_evidence_store_test.dart test/shop_responsiveness_test.dart test/shop_runtime_profile_test.dart test/shop_runtime_scope_test.dart test/shop_sqlite_full_recovery_test.dart test/shop_staff_authorization_test.dart test/shop_stock_activity_test.dart test/visual_capture_test.dart test/widget_checkout_test.dart test/widget_shell_test.dart test/widget_test_support.dart lib/shop_cash_movement_dialog.dart test/shop_cash_movement_authorized_flow_test.dart
          git diff --exit-code -- lib/camera_barcode_scanner.dart lib/connected_orders_screen.dart lib/connected_orders_service.dart lib/main.dart lib/menu_import_screen.dart lib/menu_import_service.dart lib/printer_services.dart lib/printer_setup_screen.dart lib/recent_sales_screen.dart lib/shop_backup.dart lib/shop_backup_export_screen.dart lib/shop_build_identity.g.dart lib/shop_cafe_kitchen_entitlement.dart lib/shop_cafe_order_contract.dart lib/shop_cafe_order_screen.dart lib/shop_cafe_order_store.dart lib/shop_cash_shift_screen.dart lib/shop_catalog_search.dart lib/shop_copy.dart lib/shop_correction_authorization_service.dart lib/shop_correction_consumption.dart lib/shop_correction_receipt.dart lib/shop_database.dart lib/shop_operational_export.dart lib/shop_operational_export_saver.dart lib/shop_qa_evidence_store.dart lib/shop_runtime_profile.dart lib/shop_runtime_scope.dart lib/shop_sale_correction_dialog.dart lib/shop_staff_authorization.dart lib/shop_startup.dart lib/shop_today_screen.dart lib/stock_screen.dart test/shop_add_product_test.dart test/shop_backup_test.dart test/shop_cafe_kitchen_entitlement_test.dart test/shop_cafe_order_contract_test.dart test/shop_cafe_order_screen_test.dart test/shop_cafe_order_store_test.dart test/shop_cafe_table_kitchen_test.dart test/shop_cash_movement_test.dart test/shop_catalog_search_test.dart test/shop_core_internal_acceptance_test.dart test/shop_correction_authorization_service_test.dart test/shop_foundation_test.dart test/shop_member_identity_test.dart test/shop_mmk_input_test.dart test/shop_operational_export_database_test.dart test/shop_operational_export_saver_test.dart test/shop_operational_export_test.dart test/shop_operational_export_widget_test.dart test/shop_pending_cash_checkout_test.dart test/shop_process_interrupt_worker_test.dart test/shop_qa_evidence_store_test.dart test/shop_responsiveness_test.dart test/shop_runtime_profile_test.dart test/shop_runtime_scope_test.dart test/shop_sqlite_full_recovery_test.dart test/shop_staff_authorization_test.dart test/shop_stock_activity_test.dart test/visual_capture_test.dart test/widget_checkout_test.dart test/widget_shell_test.dart test/widget_test_support.dart lib/shop_cash_movement_dialog.dart test/shop_cash_movement_authorized_flow_test.dart
          dart format lib/shop_connected_coordinator_host.dart lib/shop_connected_onboarding.dart lib/shop_connected_platform_security.dart lib/shop_connected_reservation_session.dart lib/shop_connected_runtime.dart lib/shop_connected_site_authority_store.dart lib/shop_connected_site_client.dart lib/shop_connected_site_cloud_http.dart lib/shop_connected_site_contracts.dart lib/shop_connected_site_database_adapter.dart lib/shop_connected_site_enrollment_store.dart lib/shop_connected_site_reconciliation.dart lib/shop_connected_site_reconciliation_store.dart lib/shop_connected_site_replica_store.dart lib/shop_connected_stock_reservation.dart lib/shop_offline_staff_lease.dart lib/shop_site_coordinator.dart test/shop_connected_coordinator_host_test.dart test/shop_connected_onboarding_test.dart test/shop_connected_platform_security_test.dart test/shop_connected_reservation_session_test.dart test/shop_connected_runtime_test.dart test/shop_connected_site_authority_store_test.dart test/shop_connected_site_client_test.dart test/shop_connected_site_contracts_test.dart test/shop_connected_site_database_adapter_test.dart test/shop_connected_site_enrollment_store_test.dart test/shop_connected_site_persistence_test.dart test/shop_connected_site_reconciliation_test.dart test/shop_connected_site_reconciliation_store_test.dart test/shop_connected_site_replica_store_test.dart test/shop_connected_stock_reservation_test.dart test/shop_offline_staff_lease_test.dart test/shop_site_coordinator_test.dart
          git diff --exit-code -- lib/shop_connected_coordinator_host.dart lib/shop_connected_onboarding.dart lib/shop_connected_platform_security.dart lib/shop_connected_reservation_session.dart lib/shop_connected_runtime.dart lib/shop_connected_site_authority_store.dart lib/shop_connected_site_client.dart lib/shop_connected_site_cloud_http.dart lib/shop_connected_site_contracts.dart lib/shop_connected_site_database_adapter.dart lib/shop_connected_site_enrollment_store.dart lib/shop_connected_site_reconciliation.dart lib/shop_connected_site_reconciliation_store.dart lib/shop_connected_site_replica_store.dart lib/shop_connected_stock_reservation.dart lib/shop_offline_staff_lease.dart lib/shop_site_coordinator.dart test/shop_connected_coordinator_host_test.dart test/shop_connected_onboarding_test.dart test/shop_connected_platform_security_test.dart test/shop_connected_reservation_session_test.dart test/shop_connected_runtime_test.dart test/shop_connected_site_authority_store_test.dart test/shop_connected_site_client_test.dart test/shop_connected_site_contracts_test.dart test/shop_connected_site_database_adapter_test.dart test/shop_connected_site_enrollment_store_test.dart test/shop_connected_site_persistence_test.dart test/shop_connected_site_reconciliation_test.dart test/shop_connected_site_reconciliation_store_test.dart test/shop_connected_site_replica_store_test.dart test/shop_connected_stock_reservation_test.dart test/shop_offline_staff_lease_test.dart test/shop_site_coordinator_test.dart

          dart format lib/shop_connected_application_boundary.dart test/shop_connected_application_boundary_test.dart test/shop_startup_cleanup_test.dart
          git diff --exit-code -- lib/shop_connected_application_boundary.dart test/shop_connected_application_boundary_test.dart test/shop_startup_cleanup_test.dart

      - name: Check connected attempt-store formatting
        run: |
          dart format lib/shop_connected_site_attempt_store.dart test/shop_connected_site_attempt_store_test.dart
          git diff --exit-code -- lib/shop_connected_site_attempt_store.dart test/shop_connected_site_attempt_store_test.dart

      - name: Check connected successor formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/shop_connected_composition.dart \
            lib/shop_connected_coordinator_health.dart \
            lib/shop_connected_site_client_composition.dart \
            lib/shop_connected_site_device_signer.dart \
            lib/shop_connected_trusted_time_authority.dart \
            lib/shop_connected_trusted_time_client_schema.dart \
            lib/shop_connected_trusted_time_client_store.dart \
            lib/shop_connected_trusted_time_composition.dart \
            lib/shop_connected_trusted_time_contract.dart \
            lib/shop_connected_trusted_time_exchange.dart \
            lib/shop_connected_trusted_time_head.dart \
            lib/shop_connected_trusted_time_issuer_store.dart \
            lib/shop_connected_trusted_time_platform_clock.dart \
            lib/shop_connected_trusted_time_store.dart \
            lib/shop_connected_trusted_time_stream.dart \
            lib/shop_connected_trusted_time_stream_acceptance.dart \
            lib/shop_connected_trusted_time_verifier.dart \
            test/historical_shop_fixture_support.dart \
            test/shop_connected_composition_test.dart \
            test/shop_connected_coordinator_health_test.dart \
            test/shop_connected_site_client_composition_test.dart \
            test/shop_connected_site_device_signer_test.dart \
            test/shop_connected_trusted_time_authority_test.dart \
            test/shop_connected_trusted_time_client_store_test.dart \
            test/shop_connected_trusted_time_composition_test.dart \
            test/shop_connected_trusted_time_contract_test.dart \
            test/shop_connected_trusted_time_head_test.dart \
            test/shop_connected_trusted_time_issuer_store_test.dart \
            test/shop_connected_trusted_time_platform_clock_test.dart \
            test/shop_connected_trusted_time_store_test.dart \
            test/shop_connected_trusted_time_stream_acceptance_test.dart \
            test/shop_connected_trusted_time_stream_test.dart \
            test/shop_connected_trusted_time_verifier_test.dart

      - name: Check first-sale widget in isolation
        run: timeout --signal=TERM --kill-after=10s 90s flutter test test/widget_checkout_test.dart --plain-name 'empty catalog can make a durable cash sale' --reporter expanded --timeout 60s

      - name: Check first-run restore in isolation
        run: timeout --signal=TERM --kill-after=10s 60s flutter test test/shop_backup_test.dart --plain-name 'fresh install restores before Shop opens' --reporter expanded --timeout 45s

      - name: Verify Flutter test shard inventory
        run: |
          find test -maxdepth 1 -type f -name '*_test.dart' -printf '%p\n' | sort > /tmp/shop-test-files.actual
          cat > /tmp/shop-test-files.expected <<'EOF'
          test/connected_orders_test.dart
          test/shop_add_product_test.dart
          test/shop_backup_test.dart
          test/shop_cafe_kitchen_entitlement_test.dart
          test/shop_cafe_order_contract_test.dart
          test/shop_cafe_order_screen_test.dart
          test/shop_cafe_order_store_test.dart
          test/shop_cafe_table_kitchen_test.dart
          test/shop_cash_movement_authorized_flow_test.dart
          test/shop_cash_movement_test.dart
          test/shop_catalog_search_test.dart
          test/shop_connected_application_boundary_test.dart
          test/shop_connected_composition_test.dart
          test/shop_connected_coordinator_health_test.dart
          test/shop_connected_coordinator_host_test.dart
          test/shop_connected_onboarding_test.dart
          test/shop_connected_platform_security_test.dart
          test/shop_connected_reservation_session_test.dart
          test/shop_connected_runtime_test.dart
          test/shop_connected_site_attempt_store_test.dart
          test/shop_connected_site_authority_store_test.dart
          test/shop_connected_site_client_composition_test.dart
          test/shop_connected_site_client_test.dart
          test/shop_connected_site_contracts_test.dart
          test/shop_connected_site_database_adapter_test.dart
          test/shop_connected_site_device_signer_test.dart
          test/shop_connected_site_enrollment_store_test.dart
          test/shop_connected_site_persistence_test.dart
          test/shop_connected_site_reconciliation_store_test.dart
          test/shop_connected_site_reconciliation_test.dart
          test/shop_connected_site_replica_store_test.dart
          test/shop_connected_stock_reservation_test.dart
          test/shop_connected_trusted_time_authority_test.dart
          test/shop_connected_trusted_time_client_store_test.dart
          test/shop_connected_trusted_time_composition_test.dart
          test/shop_connected_trusted_time_contract_test.dart
          test/shop_connected_trusted_time_head_test.dart
          test/shop_connected_trusted_time_issuer_store_test.dart
          test/shop_connected_trusted_time_platform_clock_test.dart
          test/shop_connected_trusted_time_store_test.dart
          test/shop_connected_trusted_time_stream_acceptance_test.dart
          test/shop_connected_trusted_time_stream_test.dart
          test/shop_connected_trusted_time_verifier_test.dart
          test/shop_core_internal_acceptance_test.dart
          test/shop_correction_authorization_service_test.dart
          test/shop_correction_consumption_test.dart
          test/shop_foundation_test.dart
          test/shop_member_identity_test.dart
          test/shop_mmk_input_test.dart
          test/shop_offline_staff_lease_test.dart
          test/shop_operational_export_database_test.dart
          test/shop_operational_export_saver_test.dart
          test/shop_operational_export_test.dart
          test/shop_operational_export_widget_test.dart
          test/shop_pending_cash_checkout_test.dart
          test/shop_process_interrupt_worker_test.dart
          test/shop_qa_evidence_store_test.dart
          test/shop_responsiveness_test.dart
          test/shop_runtime_profile_test.dart
          test/shop_runtime_scope_test.dart
          test/shop_site_coordinator_test.dart
          test/shop_sqlite_full_recovery_test.dart
          test/shop_staff_authorization_test.dart
          test/shop_startup_cleanup_test.dart
          test/shop_stock_activity_test.dart
          test/visual_capture_test.dart
          test/widget_checkout_test.dart
          test/widget_shell_test.dart
          EOF
          diff -u /tmp/shop-test-files.expected /tmp/shop-test-files.actual

      - name: Run isolated Flutter test shards
        run: |
          overall_started_at="$(date +%s)"
          behavior_core_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-behavior-core.XXXXXX")"
          behavior_shell_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-behavior-shell.XXXXXX")"
          behavior_checkout_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-behavior-checkout.XXXXXX")"
          persistence_backup_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-persistence-backup.XXXXXX")"
          persistence_a_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-persistence-a.XXXXXX")"
          persistence_b_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-persistence-b.XXXXXX")"
          connected_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-connected.XXXXXX")"
          connected_successor_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-connected-successor.XXXXXX")"
          trusted_time_tmp="$(mktemp -d "${RUNNER_TEMP}/shop-trusted-time.XXXXXX")"
          cleanup() {
            rm -rf -- "$behavior_core_tmp" "$behavior_shell_tmp" "$behavior_checkout_tmp" "$persistence_backup_tmp" "$persistence_a_tmp" "$persistence_b_tmp" "$connected_tmp" "$connected_successor_tmp" "$trusted_time_tmp"
          }
          trap cleanup EXIT
          calculate_shard_budget() {
            local elapsed remaining
            elapsed="$(( $(date +%s) - overall_started_at ))"
            remaining="$(( SHOP_FLUTTER_TEST_TOTAL_BUDGET_SECONDS - elapsed ))"
            if [ "$remaining" -le 0 ]; then
              echo "shop_flutter_test_total_budget_exhausted" >&2
              return 124
            fi
            if [ "$remaining" -lt "$SHOP_FLUTTER_TEST_SHARD_BUDGET_SECONDS" ]; then
              printf '%s\n' "$remaining"
            else
              printf '%s\n' "$SHOP_FLUTTER_TEST_SHARD_BUDGET_SECONDS"
            fi
          }
          behavior_core_budget="$(calculate_shard_budget)" || exit "$?"
          behavior_core_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$behavior_core_tmp" timeout --signal=TERM --kill-after=10s "${behavior_core_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/connected_orders_test.dart \
              test/shop_add_product_test.dart \
              test/shop_cafe_order_screen_test.dart \
              test/shop_catalog_search_test.dart \
              test/shop_correction_authorization_service_test.dart \
              test/shop_foundation_test.dart \
              test/shop_operational_export_saver_test.dart \
              test/shop_operational_export_test.dart \
              test/shop_operational_export_widget_test.dart \
              test/shop_responsiveness_test.dart \
              test/shop_runtime_profile_test.dart \
              test/shop_runtime_scope_test.dart \
              test/shop_startup_cleanup_test.dart \
              test/shop_stock_activity_test.dart
          )
          behavior_core_status="$?"
          set -e
          if [ "$behavior_core_status" -eq 124 ]; then
            echo "shop_flutter_test_behavior_core_budget_exhausted" >&2
            exit 124
          fi
          if [ "$behavior_core_status" -ne 0 ]; then
            echo "shop_flutter_test_behavior_core_failed_status:$behavior_core_status" >&2
            exit "$behavior_core_status"
          fi
          behavior_core_elapsed="$(( $(date +%s) - behavior_core_started_at ))"
          if [ "$behavior_core_elapsed" -ge "$behavior_core_budget" ]; then
            echo "shop_flutter_test_behavior_core_budget_exhausted" >&2
            exit 124
          fi
          test "$behavior_core_status" -eq 0

          behavior_shell_budget="$(calculate_shard_budget)" || exit "$?"
          behavior_shell_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$behavior_shell_tmp" timeout --signal=TERM --kill-after=10s "${behavior_shell_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/widget_shell_test.dart
          )
          behavior_shell_status="$?"
          set -e
          if [ "$behavior_shell_status" -eq 124 ]; then
            echo "shop_flutter_test_behavior_shell_budget_exhausted" >&2
            exit 124
          fi
          if [ "$behavior_shell_status" -ne 0 ]; then
            echo "shop_flutter_test_behavior_shell_failed_status:$behavior_shell_status" >&2
            exit "$behavior_shell_status"
          fi
          behavior_shell_elapsed="$(( $(date +%s) - behavior_shell_started_at ))"
          if [ "$behavior_shell_elapsed" -ge "$behavior_shell_budget" ]; then
            echo "shop_flutter_test_behavior_shell_budget_exhausted" >&2
            exit 124
          fi
          test "$behavior_shell_status" -eq 0

          behavior_checkout_budget="$(calculate_shard_budget)" || exit "$?"
          behavior_checkout_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$behavior_checkout_tmp" timeout --signal=TERM --kill-after=10s "${behavior_checkout_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/widget_checkout_test.dart
          )
          behavior_checkout_status="$?"
          set -e
          if [ "$behavior_checkout_status" -eq 124 ]; then
            echo "shop_flutter_test_behavior_checkout_budget_exhausted" >&2
            exit 124
          fi
          if [ "$behavior_checkout_status" -ne 0 ]; then
            echo "shop_flutter_test_behavior_checkout_failed_status:$behavior_checkout_status" >&2
            exit "$behavior_checkout_status"
          fi
          behavior_checkout_elapsed="$(( $(date +%s) - behavior_checkout_started_at ))"
          if [ "$behavior_checkout_elapsed" -ge "$behavior_checkout_budget" ]; then
            echo "shop_flutter_test_behavior_checkout_budget_exhausted" >&2
            exit 124
          fi
          test "$behavior_checkout_status" -eq 0

          persistence_backup_budget="$(calculate_shard_budget)" || exit "$?"
          persistence_backup_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$persistence_backup_tmp" timeout --signal=TERM --kill-after=10s "${persistence_backup_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/shop_backup_test.dart
          )
          persistence_backup_status="$?"
          set -e
          if [ "$persistence_backup_status" -eq 124 ]; then
            echo "shop_flutter_test_persistence_backup_budget_exhausted" >&2
            exit 124
          fi
          if [ "$persistence_backup_status" -ne 0 ]; then
            echo "shop_flutter_test_persistence_backup_failed_status:$persistence_backup_status" >&2
            exit "$persistence_backup_status"
          fi
          persistence_backup_elapsed="$(( $(date +%s) - persistence_backup_started_at ))"
          if [ "$persistence_backup_elapsed" -ge "$persistence_backup_budget" ]; then
            echo "shop_flutter_test_persistence_backup_budget_exhausted" >&2
            exit 124
          fi
          test "$persistence_backup_status" -eq 0

          persistence_a_budget="$(calculate_shard_budget)" || exit "$?"
          persistence_a_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$persistence_a_tmp" timeout --signal=TERM --kill-after=10s "${persistence_a_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/shop_cafe_kitchen_entitlement_test.dart \
              test/shop_cafe_order_contract_test.dart \
              test/shop_cafe_order_store_test.dart \
              test/shop_cafe_table_kitchen_test.dart \
              test/shop_cash_movement_authorized_flow_test.dart \
              test/shop_cash_movement_test.dart \
              test/shop_core_internal_acceptance_test.dart
          )
          persistence_a_status="$?"
          set -e
          if [ "$persistence_a_status" -eq 124 ]; then
            echo "shop_flutter_test_persistence_a_budget_exhausted" >&2
            exit 124
          fi
          if [ "$persistence_a_status" -ne 0 ]; then
            echo "shop_flutter_test_persistence_a_failed_status:$persistence_a_status" >&2
            exit "$persistence_a_status"
          fi
          persistence_a_elapsed="$(( $(date +%s) - persistence_a_started_at ))"
          if [ "$persistence_a_elapsed" -ge "$persistence_a_budget" ]; then
            echo "shop_flutter_test_persistence_a_budget_exhausted" >&2
            exit 124
          fi
          test "$persistence_a_status" -eq 0

          persistence_b_budget="$(calculate_shard_budget)" || exit "$?"
          persistence_b_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$persistence_b_tmp" timeout --signal=TERM --kill-after=10s "${persistence_b_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/shop_correction_consumption_test.dart \
              test/shop_member_identity_test.dart \
              test/shop_mmk_input_test.dart \
              test/shop_operational_export_database_test.dart \
              test/shop_pending_cash_checkout_test.dart \
              test/shop_qa_evidence_store_test.dart \
              test/shop_sqlite_full_recovery_test.dart \
              test/shop_staff_authorization_test.dart \
              test/visual_capture_test.dart
          )
          persistence_b_status="$?"
          set -e
          if [ "$persistence_b_status" -eq 124 ]; then
            echo "shop_flutter_test_persistence_b_budget_exhausted" >&2
            exit 124
          fi
          if [ "$persistence_b_status" -ne 0 ]; then
            echo "shop_flutter_test_persistence_b_failed_status:$persistence_b_status" >&2
            exit "$persistence_b_status"
          fi
          persistence_b_elapsed="$(( $(date +%s) - persistence_b_started_at ))"
          if [ "$persistence_b_elapsed" -ge "$persistence_b_budget" ]; then
            echo "shop_flutter_test_persistence_b_budget_exhausted" >&2
            exit 124
          fi
          test "$persistence_b_status" -eq 0

          connected_budget="$(calculate_shard_budget)" || exit "$?"
          connected_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$connected_tmp" timeout --signal=TERM --kill-after=10s "${connected_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/shop_connected_application_boundary_test.dart \
              test/shop_connected_coordinator_host_test.dart \
              test/shop_connected_onboarding_test.dart \
              test/shop_connected_platform_security_test.dart \
              test/shop_connected_reservation_session_test.dart \
              test/shop_connected_runtime_test.dart \
              test/shop_connected_site_attempt_store_test.dart \
              test/shop_connected_site_authority_store_test.dart \
              test/shop_connected_site_client_test.dart \
              test/shop_connected_site_contracts_test.dart \
              test/shop_connected_site_database_adapter_test.dart \
              test/shop_connected_site_enrollment_store_test.dart \
              test/shop_connected_site_persistence_test.dart \
              test/shop_connected_site_reconciliation_test.dart \
              test/shop_connected_site_reconciliation_store_test.dart \
              test/shop_connected_site_replica_store_test.dart \
              test/shop_connected_stock_reservation_test.dart \
              test/shop_offline_staff_lease_test.dart \
              test/shop_site_coordinator_test.dart
          )
          connected_status="$?"
          set -e
          if [ "$connected_status" -eq 124 ]; then
            echo "shop_flutter_test_connected_budget_exhausted" >&2
            exit 124
          fi
          if [ "$connected_status" -ne 0 ]; then
            echo "shop_flutter_test_connected_failed_status:$connected_status" >&2
            exit "$connected_status"
          fi
          connected_elapsed="$(( $(date +%s) - connected_started_at ))"
          if [ "$connected_elapsed" -ge "$connected_budget" ]; then
            echo "shop_flutter_test_connected_budget_exhausted" >&2
            exit 124
          fi
          test "$connected_status" -eq 0

          connected_successor_budget="$(calculate_shard_budget)" || exit "$?"
          connected_successor_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$connected_successor_tmp" timeout --signal=TERM --kill-after=10s "${connected_successor_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/shop_connected_composition_test.dart \
              test/shop_connected_coordinator_health_test.dart \
              test/shop_connected_site_client_composition_test.dart \
              test/shop_connected_site_device_signer_test.dart
          )
          connected_successor_status="$?"
          set -e
          if [ "$connected_successor_status" -eq 124 ]; then
            echo "shop_flutter_test_connected_successor_budget_exhausted" >&2
            exit 124
          fi
          if [ "$connected_successor_status" -ne 0 ]; then
            echo "shop_flutter_test_connected_successor_failed_status:$connected_successor_status" >&2
            exit "$connected_successor_status"
          fi
          connected_successor_elapsed="$(( $(date +%s) - connected_successor_started_at ))"
          if [ "$connected_successor_elapsed" -ge "$connected_successor_budget" ]; then
            echo "shop_flutter_test_connected_successor_budget_exhausted" >&2
            exit 124
          fi
          test "$connected_successor_status" -eq 0

          trusted_time_budget="$(calculate_shard_budget)" || exit "$?"
          trusted_time_started_at="$(date +%s)"
          set +e
          (
            TMPDIR="$trusted_time_tmp" timeout --signal=TERM --kill-after=10s "${trusted_time_budget}s" flutter test --no-pub --concurrency=1 --reporter expanded --timeout 2m \
              test/shop_connected_trusted_time_authority_test.dart \
              test/shop_connected_trusted_time_client_store_test.dart \
              test/shop_connected_trusted_time_composition_test.dart \
              test/shop_connected_trusted_time_contract_test.dart \
              test/shop_connected_trusted_time_head_test.dart \
              test/shop_connected_trusted_time_issuer_store_test.dart \
              test/shop_connected_trusted_time_platform_clock_test.dart \
              test/shop_connected_trusted_time_store_test.dart \
              test/shop_connected_trusted_time_stream_acceptance_test.dart \
              test/shop_connected_trusted_time_stream_test.dart \
              test/shop_connected_trusted_time_verifier_test.dart
          )
          trusted_time_status="$?"
          set -e
          if [ "$trusted_time_status" -eq 124 ]; then
            echo "shop_flutter_test_trusted_time_budget_exhausted" >&2
            exit 124
          fi
          if [ "$trusted_time_status" -ne 0 ]; then
            echo "shop_flutter_test_trusted_time_failed_status:$trusted_time_status" >&2
            exit "$trusted_time_status"
          fi
          trusted_time_elapsed="$(( $(date +%s) - trusted_time_started_at ))"
          if [ "$trusted_time_elapsed" -ge "$trusted_time_budget" ]; then
            echo "shop_flutter_test_trusted_time_budget_exhausted" >&2
            exit 124
          fi
          test "$trusted_time_status" -eq 0
          overall_elapsed="$(( $(date +%s) - overall_started_at ))"
          if [ "$overall_elapsed" -ge "$SHOP_FLUTTER_TEST_TOTAL_BUDGET_SECONDS" ]; then
            echo "shop_flutter_test_total_budget_exhausted" >&2
            exit 124
          fi

      - name: Run real Flutter process-interruption scenarios
        run: |
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          test -x "$flutter_bin"
          FLUTTER_BIN="$flutter_bin" timeout --signal=TERM --kill-after=10s 180s python3 scripts/test_shop_process_interruption.py

      - name: Generate Android production identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform android --profile production

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Capture synthetic Flutter screens with bundled fonts
        env:
          SHOP_VISUAL_CAPTURE: "1"
        run: |
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          export SHOP_MATERIAL_ICONS_FONT="$(dirname "$flutter_bin")/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -f "$SHOP_MATERIAL_ICONS_FONT"
          timeout --signal=TERM --kill-after=10s 180s flutter test test/visual_capture_test.dart --update-goldens --reporter expanded --timeout 60s

      - name: Retain Flutter-rendered screens for design review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-flutter-renders-${{ github.sha }}
          path: |
            mobile/shop_pos/test/goldens/shop_checkout_1200_en.png
            mobile/shop_pos/test/goldens/shop_checkout_1200_my.png
            mobile/shop_pos/test/goldens/shop_checkout_390_en.png
            mobile/shop_pos/test/goldens/shop_checkout_390_my.png
            mobile/shop_pos/test/goldens/shop_checkout_820_en.png
            mobile/shop_pos/test/goldens/shop_checkout_820_my.png
            mobile/shop_pos/test/goldens/shop_sell_390_en.png
            mobile/shop_pos/test/goldens/shop_sell_390_my.png
            mobile/shop_pos/test/goldens/shop_stock_1200_en.png
            mobile/shop_pos/test/goldens/shop_stock_390_en.png
            mobile/shop_pos/test/goldens/shop_stock_390_my.png
            mobile/shop_pos/test/goldens/shop_stock_820_en.png
            mobile/shop_pos/test/goldens/shop_stock_820_my.png
            mobile/shop_pos/test/goldens/shop_today_1200_en.png
            mobile/shop_pos/test/goldens/shop_today_390_en.png
            mobile/shop_pos/test/goldens/shop_today_390_my.png
            mobile/shop_pos/test/goldens/shop_today_820_en.png
            mobile/shop_pos/test/goldens/shop_today_820_my.png
          if-no-files-found: error
          retention-days: 14

      - name: Reject unsigned Android release packaging
        run: |
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_KEYSTORE_PATH
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_KEY_ALIAS
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_STORE_PASSWORD
          unset ORG_GRADLE_PROJECT_SHOP_ANDROID_KEY_PASSWORD
          cleanup_release_outputs() {
            release_files="$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-production-release*.apk' -print 2>/dev/null)"
            if [ -n "$release_files" ]; then
              rm -f build/app/outputs/flutter-apk/app-production-release*.apk
              return 1
            fi
          }
          trap 'result=$?; cleanup_release_outputs || result=1; trap - EXIT; exit "$result"' EXIT
          rm -f build/app/outputs/flutter-apk/app-production-release*.apk
          set +e
          release_output="$(flutter build apk --release --no-pub --flavor production 2>&1)"
          release_status=$?
          set -e
          test "$release_status" -ne 0
          printf '%s\n' "$release_output" | grep -F 'shop_android_release_signing_unavailable'
          test -z "$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-production-release*.apk' -print -quit 2>/dev/null)"
          set +e
          aggregate_output="$(cd android && ./gradlew assembleProductionRelease --console=plain 2>&1)"
          aggregate_status=$?
          set -e
          test "$aggregate_status" -ne 0
          printf '%s\n' "$aggregate_output" | grep -F 'shop_android_release_signing_unavailable'
          test -z "$(find build/app/outputs/flutter-apk -maxdepth 1 -name 'app-production-release*.apk' -print -quit 2>/dev/null)"

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --flavor production

      - name: Record Android debug APK checksum
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-production-debug.apk > app-production-debug.apk.sha256
          sha256sum --check app-production-debug.apk.sha256

      - name: Retain Android debug APK for device QA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-android-production-debug-${{ github.sha }}
          path: |
            mobile/shop_pos/build/app/outputs/flutter-apk/app-production-debug.apk
            mobile/shop_pos/build/app/outputs/flutter-apk/app-production-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build iPad/iOS app
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate iOS production identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform ios --profile production

      - name: Build iOS app without signing
        run: flutter build ios --debug --no-codesign --no-pub

  windows:
    name: Build Windows PC app
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Generate Windows runner without touching the app lockfile
        shell: pwsh
        run: |
          $lockBefore = (Get-FileHash -Algorithm SHA256 -LiteralPath 'pubspec.lock').Hash
          $runnerSource = Join-Path $env:RUNNER_TEMP 'supermega_shop_windows_runner'
          flutter create --platforms=windows --no-pub --project-name supermega_shop $runnerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $runnerSource 'windows') -Destination 'windows' -Recurse
          & .\windows_overlay\apply.ps1
          & .\scripts\build_windows_icon.ps1
          $lockAfter = (Get-FileHash -Algorithm SHA256 -LiteralPath 'pubspec.lock').Hash
          if ($lockBefore -ne $lockAfter) { throw 'Windows runner generation changed the committed pubspec.lock.' }

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Windows production identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform windows --profile production

      - name: Prove backup restore and no-replace behavior on Windows
        run: flutter test test/shop_backup_test.dart --reporter expanded --timeout 2m

      - name: Build unsigned Windows app
        run: flutter build windows --release --no-pub

      - name: Package complete Windows app for device QA
        shell: pwsh
        run: |
          $releaseDir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path -LiteralPath $releaseDir)) { throw 'Windows release directory is missing.' }
          $packagePath = 'build/supermega-shop-windows-unsigned.zip'
          $checksumPath = "$packagePath.sha256"
          Compress-Archive -Path (Join-Path $releaseDir '*') -DestinationPath $packagePath
          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $packagePath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$checksum  supermega-shop-windows-unsigned.zip" -Encoding ascii
          if (-not (Test-Path -LiteralPath $checksumPath)) { throw 'Windows package checksum is missing.' }
          $recordedChecksum = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $expectedChecksum = "$checksum  supermega-shop-windows-unsigned.zip"
          if ($recordedChecksum -cne $expectedChecksum) { throw 'Windows package checksum verification failed.' }

      - name: Retain Windows QA package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-shop-windows-unsigned-${{ github.sha }}
          path: |
            mobile/shop_pos/build/supermega-shop-windows-unsigned.zip
            mobile/shop_pos/build/supermega-shop-windows-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14

  android-qa:
    name: Build isolated Android synthetic QA app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prove clean exact source before Android QA generation
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Generate Android QA identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform android --profile synthetic_qa_v1

      - name: Record generated Android QA identity digest
        working-directory: ${{ github.workspace }}
        run: sha256sum mobile/shop_pos/lib/shop_build_identity.g.dart > "${RUNNER_TEMP}/shop-build-identity.sha256"

      - name: Build Android QA
        env:
          ORG_GRADLE_PROJECT_SHOP_ANDROID_KEYSTORE_PATH: ''
          ORG_GRADLE_PROJECT_SHOP_ANDROID_KEY_ALIAS: ''
          ORG_GRADLE_PROJECT_SHOP_ANDROID_STORE_PASSWORD: ''
          ORG_GRADLE_PROJECT_SHOP_ANDROID_KEY_PASSWORD: ''
        run: flutter build apk --debug --no-pub --flavor qa --dart-define=SHOP_RUNTIME_PROFILE=synthetic_qa_v1 --dart-define=SHOP_QA_PROFILE_ID=synthetic-qa-v1

      - name: Stage Android QA artifact
        run: cp build/app/outputs/flutter-apk/app-qa-debug.apk "${{ github.workspace }}/app-qa-debug.apk"

      - name: Inspect Android QA identity
        working-directory: ${{ github.workspace }}
        run: |
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk_root"
          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            test "$(readlink -f "$ANDROID_SDK_ROOT")" = "$(readlink -f "$ANDROID_HOME")"
          fi
          android_sdk_root="$(readlink -f "$android_sdk_root")"
          analyzer="$android_sdk_root/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$analyzer"
          test "$("$analyzer" manifest application-id app-qa-debug.apk)" = 'dev.supermega.supermega_shop.qa'
          manifest_xml="$(mktemp)"
          trap 'rm -f "$manifest_xml"' EXIT
          "$analyzer" manifest print app-qa-debug.apk > "$manifest_xml"
          "$analyzer" files list app-qa-debug.apk > app-qa-debug.apk.files.txt
          APPLICATION_ID="$("$analyzer" manifest application-id app-qa-debug.apk)" \
          VERSION_CODE="$("$analyzer" manifest version-code app-qa-debug.apk)" \
          VERSION_NAME="$("$analyzer" manifest version-name app-qa-debug.apk)" \
          MIN_SDK="$("$analyzer" manifest min-sdk app-qa-debug.apk)" \
          TARGET_SDK="$("$analyzer" manifest target-sdk app-qa-debug.apk)" \
          BUILD_IDENTITY_SHA256="$(awk '{print $1}' "${RUNNER_TEMP}/shop-build-identity.sha256")" \
          python3 - "$manifest_xml" app-qa-debug.apk.files.txt app-qa-debug.apk.identity.json <<'PY'
          import json, os, pathlib, re, sys, xml.etree.ElementTree as ET
          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          apps = root.findall("application")
          items = apps[0].findall("meta-data") if len(apps) == 1 else []
          metadata = {item.get(android + "name"): item.get(android + "value") for item in items}
          expected = {
              "dev.supermega.shop.qa.capabilityContract": "supermega.shop.android-qa-capabilities.v1",
              "dev.supermega.shop.qa.evidenceContract": "supermega.shop.synthetic-qa-evidence.v1",
              "dev.supermega.shop.qa.scopedEncryptedRestore": "true",
              "dev.supermega.shop.qa.scopedSyntheticExport": "true",
              "dev.supermega.shop.qa.generalExternalFileAccess": "false",
          }
          file_lines = [line.strip().lstrip("/") for line in pathlib.Path(sys.argv[2]).read_text().splitlines()]
          library_lines = [line for line in file_lines if line.startswith("lib/")]
          library_files = [line for line in library_lines if not line.endswith("/")]
          library_matches = [re.fullmatch(r"lib/([^/]+)/[^/]+\.so", line) for line in library_files]
          if not library_files or any(match is None for match in library_matches):
              raise SystemExit("shop_android_qa_abi_inventory_invalid")
          abis = sorted({match.group(1) for match in library_matches})
          compile_sdk = root.get("platformBuildVersionCode")
          valid = (len(apps) == 1 and len(metadata) == len(items)
                   and apps[0].get(android + "label") == "Shop QA"
                   and all(metadata.get(key) == value for key, value in expected.items())
                   and compile_sdk and abis)
          if not valid:
              raise SystemExit("shop_android_qa_identity_or_capability_mismatch")
          identity = {
              "applicationId": os.environ["APPLICATION_ID"],
              "applicationLabel": "Shop QA",
              "capabilityContract": expected["dev.supermega.shop.qa.capabilityContract"],
              "evidenceContract": expected["dev.supermega.shop.qa.evidenceContract"],
              "scopedEncryptedRestore": True,
              "scopedSyntheticExport": True,
              "generalExternalFileAccess": False,
              "versionCode": os.environ["VERSION_CODE"],
              "versionName": os.environ["VERSION_NAME"],
              "compileSdk": int(compile_sdk),
              "minSdk": int(os.environ["MIN_SDK"]),
              "targetSdk": int(os.environ["TARGET_SDK"]),
              "abis": abis,
              "buildIdentitySha256": os.environ["BUILD_IDENTITY_SHA256"],
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(identity, separators=(",", ":")))
          PY
          rm -f "$manifest_xml"
          rm -f app-qa-debug.apk.files.txt
          trap - EXIT

      - name: Verify Android QA debug signature
        working-directory: ${{ github.workspace }}
        run: |
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk_root"
          android_sdk_root="$(readlink -f "$android_sdk_root")"
          build_tools_version='36.0.0'
          apksigner="$android_sdk_root/build-tools/$build_tools_version/apksigner"
          apksigner_jar="$android_sdk_root/build-tools/$build_tools_version/lib/apksigner.jar"
          build_tools_properties="$android_sdk_root/build-tools/$build_tools_version/source.properties"
          test -x "$apksigner"
          test -f "$apksigner_jar"
          test -f "$build_tools_properties"
          signature_log="$(mktemp)"
          trap 'rm -f "$signature_log"' EXIT
          LC_ALL=C "$apksigner" verify --verbose --print-certs app-qa-debug.apk > "$signature_log"
          BUILD_TOOLS_VERSION="$build_tools_version" \
          APKSIGNER_SHA256="$(sha256sum "$apksigner" | awk '{print $1}')" \
          APKSIGNER_JAR_SHA256="$(sha256sum "$apksigner_jar" | awk '{print $1}')" \
          BUILD_TOOLS_PROPERTIES_SHA256="$(sha256sum "$build_tools_properties" | awk '{print $1}')" \
          python3 - "$signature_log" app-qa-debug.apk.signing.json <<'PY'
          import json, os, pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          matches = re.findall(r"^Signer #(\d+) certificate SHA-256 digest: ([0-9a-fA-F]{64})$", text, re.MULTILINE)
          if len(matches) != 1 or matches[0][0] != "1":
              raise SystemExit("shop_android_qa_signer_digest_invalid")
          evidence = {
              "classification": "android_debug",
              "productionSigned": False,
              "stableUpdateIdentityProven": False,
              "certificateSha256": matches[0][1].lower(),
              "signatureVerified": True,
              "apksignerBuildToolsVersion": os.environ["BUILD_TOOLS_VERSION"],
              "apksignerSha256": os.environ["APKSIGNER_SHA256"],
              "apksignerJarSha256": os.environ["APKSIGNER_JAR_SHA256"],
              "buildToolsSourcePropertiesSha256": os.environ["BUILD_TOOLS_PROPERTIES_SHA256"],
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(evidence, separators=(",", ":")))
          PY

      - name: Hash Android QA artifact
        working-directory: ${{ github.workspace }}
        run: sha256sum app-qa-debug.apk > app-qa-debug.apk.sha256

      - name: Record observed Android QA toolchain
        working-directory: ${{ github.workspace }}
        run: flutter --version --machine > app-qa-debug.apk.toolchain.json

      - name: Bind Android QA artifact to exact source and observations
        working-directory: ${{ github.workspace }}
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          sha256sum --check "${RUNNER_TEMP}/shop-build-identity.sha256"
          test -z "$(git diff --cached --name-only)"
          changed_paths="$(git diff --name-only)"
          test -z "$changed_paths" || test "$changed_paths" = 'mobile/shop_pos/lib/shop_build_identity.g.dart'
          untracked_before_manifest="$(git ls-files --others --exclude-standard | sort)"
          expected_before_manifest="$(printf '%s\n' app-qa-debug.apk app-qa-debug.apk.identity.json app-qa-debug.apk.sha256 app-qa-debug.apk.signing.json app-qa-debug.apk.toolchain.json | sort)"
          test "$untracked_before_manifest" = "$expected_before_manifest"
          node tools/write_shop_qa_artifact_manifest.mjs --platform android --artifact app-qa-debug.apk --checksum app-qa-debug.apk.sha256 --toolchain app-qa-debug.apk.toolchain.json --signing app-qa-debug.apk.signing.json --identity app-qa-debug.apk.identity.json --output app-qa-debug.apk.manifest
          untracked_after_manifest="$(git ls-files --others --exclude-standard | sort)"
          expected_after_manifest="$(printf '%s\n' app-qa-debug.apk app-qa-debug.apk.identity.json app-qa-debug.apk.manifest app-qa-debug.apk.sha256 app-qa-debug.apk.signing.json app-qa-debug.apk.toolchain.json | sort)"
          test "$untracked_after_manifest" = "$expected_after_manifest"

      - name: Upload promotion-ineligible Android QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-promotion-ineligible-${{ github.sha }}-sha-256-android
          path: |
            app-qa-debug.apk
            app-qa-debug.apk.sha256
            app-qa-debug.apk.toolchain.json
            app-qa-debug.apk.signing.json
            app-qa-debug.apk.identity.json
            app-qa-debug.apk.manifest
          if-no-files-found: error
          retention-days: 7

  ios-qa:
    name: Build isolated iOS synthetic QA app
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate iOS QA identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform ios --profile synthetic_qa_v1

      - name: Build iOS QA
        run: flutter build ios --debug --no-codesign --no-pub --flavor qa --dart-define=SHOP_RUNTIME_PROFILE=synthetic_qa_v1 --dart-define=SHOP_QA_PROFILE_ID=synthetic-qa-v1

      - name: Inspect iOS QA identity
        run: |
          info='build/ios/iphoneos/Runner.app/Info.plist'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = 'dev.supermega.supermegaShop.qa'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info")" = 'Shop QA'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$info")" = 'Shop QA'

      - name: Prove iOS QA app is not code signed
        working-directory: ${{ github.workspace }}
        run: |
          signature_log="$(mktemp)"
          trap 'rm -f "$signature_log"' EXIT
          if codesign -dv --verbose=4 mobile/shop_pos/build/ios/iphoneos/Runner.app 2>"$signature_log"; then
            echo 'shop_ios_qa_unexpected_signature' >&2
            exit 1
          fi
          grep -Fq 'code object is not signed at all' "$signature_log"
          printf '%s\n' '{"classification":"ios_no_codesign","productionSigned":false,"stableUpdateIdentityProven":false}' > Runner.app.zip.signing.json

      - name: Stage iOS QA artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "${{ github.workspace }}/Runner.app.zip"

      - name: Hash iOS QA artifact
        working-directory: ${{ github.workspace }}
        run: shasum -a 256 Runner.app.zip > Runner.app.zip.sha256

      - name: Record observed iOS QA toolchain
        working-directory: ${{ github.workspace }}
        run: flutter --version --machine > Runner.app.zip.toolchain.json

      - name: Bind iOS QA artifact to source
        working-directory: ${{ github.workspace }}
        run: node tools/write_shop_qa_artifact_manifest.mjs --platform ios --artifact Runner.app.zip --checksum Runner.app.zip.sha256 --toolchain Runner.app.zip.toolchain.json --signing Runner.app.zip.signing.json --output Runner.app.zip.manifest

      - name: Upload promotion-ineligible iOS QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-promotion-ineligible-${{ github.sha }}-sha-256-ios
          path: |
            Runner.app.zip
            Runner.app.zip.sha256
            Runner.app.zip.toolchain.json
            Runner.app.zip.signing.json
            Runner.app.zip.manifest
          if-no-files-found: error
          retention-days: 7

  windows-qa:
    name: Build isolated Windows synthetic QA app
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: mobile/shop_pos
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Generate Windows runner
        run: |
          $runnerSource = Join-Path $env:RUNNER_TEMP 'supermega_shop_windows_qa_runner'
          flutter create --platforms=windows --no-pub --project-name supermega_shop $runnerSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $runnerSource 'windows') -Destination 'windows' -Recurse
          & .\windows_overlay\apply.ps1

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Windows QA identity
        working-directory: ${{ github.workspace }}
        run: node tools/generate_shop_build_identity.mjs --platform windows --profile synthetic_qa_v1

      - name: Configure Windows QA runner
        run: .\scripts\configure_windows_qa_runner.ps1

      - name: Build Windows QA
        run: flutter build windows --release --no-pub --dart-define=SHOP_RUNTIME_PROFILE=synthetic_qa_v1 --dart-define=SHOP_QA_PROFILE_ID=synthetic-qa-v1

      - name: Inspect Windows QA identity
        run: |
          $executable = 'build\windows\x64\runner\Release\supermega_shop_qa.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'shop_windows_qa_executable_missing' }
          $identity = (Get-Item -LiteralPath $executable).VersionInfo
          if ($identity.ProductName -cne 'Shop QA' -or
              $identity.FileDescription -cne 'Shop QA' -or
              $identity.InternalName -cne 'supermega_shop_qa' -or
              $identity.OriginalFilename -cne 'supermega_shop_qa.exe') {
            throw 'shop_windows_qa_built_identity_mismatch'
          }

      - name: Prove Windows QA executable is unsigned
        working-directory: ${{ github.workspace }}
        run: |
          $executable = 'mobile\shop_pos\build\windows\x64\runner\Release\supermega_shop_qa.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $executable
          if ($signature.Status -cne 'NotSigned' -or $null -ne $signature.SignerCertificate) {
            throw 'shop_windows_qa_unexpected_signature'
          }
          [ordered]@{
            classification = 'windows_unsigned'
            productionSigned = $false
            stableUpdateIdentityProven = $false
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath 'supermega-shop-windows-qa.zip.signing.json' -Encoding utf8NoBOM

      - name: Package full Windows QA runtime
        run: |
          $releaseDirectory = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $packagePath = Join-Path $env:GITHUB_WORKSPACE 'supermega-shop-windows-qa.zip'
          Compress-Archive -Path $releaseDirectory -DestinationPath $packagePath -CompressionLevel Optimal

      - name: Hash and verify Windows QA package
        working-directory: ${{ github.workspace }}
        run: |
          $artifact = 'supermega-shop-windows-qa.zip'
          $checksumPath = "$artifact.sha256"
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
          "$digest  $artifact" | Set-Content -LiteralPath $checksumPath -Encoding ascii -NoNewline
          $expected = "$((Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant())  $artifact"
          $recorded = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($recorded -cne $expected) { throw 'shop_windows_qa_checksum_mismatch' }

      - name: Record observed Windows QA toolchain
        working-directory: ${{ github.workspace }}
        run: flutter --version --machine | Set-Content -LiteralPath 'supermega-shop-windows-qa.zip.toolchain.json' -Encoding utf8NoBOM

      - name: Bind Windows QA artifact to source
        working-directory: ${{ github.workspace }}
        run: node tools/write_shop_qa_artifact_manifest.mjs --platform windows --artifact supermega-shop-windows-qa.zip --checksum supermega-shop-windows-qa.zip.sha256 --toolchain supermega-shop-windows-qa.zip.toolchain.json --signing supermega-shop-windows-qa.zip.signing.json --output supermega-shop-windows-qa.zip.manifest

      - name: Upload promotion-ineligible Windows QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-qa-promotion-ineligible-${{ github.sha }}-sha-256-windows
          path: |
            supermega-shop-windows-qa.zip
            supermega-shop-windows-qa.zip.sha256
            supermega-shop-windows-qa.zip.toolchain.json
            supermega-shop-windows-qa.zip.signing.json
            supermega-shop-windows-qa.zip.manifest
          if-no-files-found: error
          retention-days: 7
