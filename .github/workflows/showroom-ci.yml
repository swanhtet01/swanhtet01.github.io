name: SuperMega App CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    # Same-repository commits always receive the full push check. Give the
    # redundant PR event a DIFFERENT name so a skipped job cannot satisfy the
    # required SuperMega App CI context. Fork PRs still run every check here.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Same-repository PR uses push checks' || 'SuperMega App CI' }}
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPERMEGA_CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SUPERMEGA_CI_SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Prepare PostgreSQL 17 test tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/supermega-pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17 openssl
          /usr/lib/postgresql/17/bin/postgres --version
          echo "SUPERMEGA_POSTGRES17_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Verify canonical API contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify durable signup budgets on disposable PostgreSQL
        env:
          SUPERMEGA_TEST_DISPOSABLE_PG17: '1'
        run: python -m unittest tests.test_self_serve_durable_budget -v

      - name: Verify Sites photos publishing and follow-up on disposable PostgreSQL
        env:
          SUPERMEGA_TEST_POSTGRES: '1'
          SUPERMEGA_RUN_WEBSITE_INQUIRY_SQL: '1'
          SUPERMEGA_RUN_WEBSITE_DOMAIN_SQL: '1'
          SUPERMEGA_TRIAL_SCHEMA_VERSION: '13'
          SUPERMEGA_TEST_POSTGRES_BIN: /usr/lib/postgresql/17/bin
          OTEL_SDK_DISABLED: 'true'
        run: python tools/verify_sites_database.py --require-supported-python --receipt .tmp/sites-database-ci.json

      - name: Verify Commerce public retention on disposable PostgreSQL
        env:
          SUPERMEGA_RUN_COMMERCE_PUBLIC_SQL: '1'
          SUPERMEGA_TRIAL_SCHEMA_VERSION: '13'
          SUPERMEGA_BILLING_SCHEMA_VERSION: '13'
          OTEL_SDK_DISABLED: 'true'
        run: python -m unittest tests.test_commerce_public_storefront tests.test_commerce_public_retention_runner -v

      - name: Verify source runtime and packaged import guards
        run: |
          python tools/test_app_runtime_bundle.py
          python tools/test_packaged_app_import.py

      - name: Install migration verifier
        run: npm ci --ignore-scripts

      - name: Verify coordinated release and RLS guards
        run: |
          node --test tools/prepare_release_integration_batch.test.mjs
          node --test tools/run_app_verify_annotation.test.mjs
          python tools/validate_supermega_database_url.py --self-test
          node tools/verify_private_trial_migrations.mjs
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs
          node tools/verify_public_deploy_guard.mjs
          node --test tools/verify_public_deploy_guard.test.mjs
          node --test tools/verify_acceptance_runtime_environment.test.mjs

      - name: Install dependencies
        working-directory: showroom
        run: npm ci

      - name: Lint app
        working-directory: showroom
        run: npm run lint

      - name: Generate app deployment contract
        run: node tools/write_app_vercel_config.mjs

      - name: Build and verify canonical app
        env:
          SUPERMEGA_RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run app:build:checked

      - name: Verify unauthenticated product access gates
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          SUPERMEGA_RENDERED_EVIDENCE_DIR: ${{ runner.temp }}/supermega-app-entry-rendered-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -x "$CHROMIUM_BIN"
          "$CHROMIUM_BIN" --version
          node --test --test-concurrency=1 tools/browser_startup.test.mjs
          node tools/verify_app_entry_rendered.mjs \
            --auth-only \
            --out "$SUPERMEGA_RENDERED_EVIDENCE_DIR/report.json" \
            --screenshot-dir "$SUPERMEGA_RENDERED_EVIDENCE_DIR" \
            --expected-head "$SUPERMEGA_CI_SOURCE_SHA"
          node tools/validate_app_entry_rendered_report.mjs \
            --report "$SUPERMEGA_RENDERED_EVIDENCE_DIR/report.json" \
            --expected-head "$SUPERMEGA_CI_SOURCE_SHA" \
            --expected-scope auth-entry

      - name: Capture source-bound product gallery candidate
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: |
          node tools/capture_public_gallery.mjs > "$RUNNER_TEMP/gallery-candidate.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from shutil import copy2
          from urllib.parse import parse_qs, urlsplit

          report = Path(os.environ['RUNNER_TEMP'], 'gallery-candidate.json')
          evidence = json.loads(report.read_text(encoding='utf-8'))
          assert evidence['ok'] is True
          assert evidence['classification'] == 'candidate_only_local_real_component_synthetic'
          assert evidence['publicationReady'] is False
          assert evidence['sourceCommit'] == os.environ['SUPERMEGA_CI_SOURCE_SHA']
          assert evidence['deniedExternal'] == 0
          assert evidence['completedSale'] is True
          assert evidence['customerReceiptVisible'] is False
          assert evidence['fulfilledSyntheticMedia'] == 3
          captures = evidence['captures']
          assert len(captures) == 16
          expected = {
              'actual-shop-first-run.png', 'actual-shop-today.png', 'actual-shop-sell.png', 'actual-shop-order-record.png', 'actual-shop-orders.png',
              'actual-sites-editor.png', 'actual-sites-inquiries.png',
              'actual-commerce-catalog.png', 'actual-commerce-order-request.png',
              'actual-shop-today-mobile.png', 'actual-shop-sell-mobile.png', 'actual-shop-orders-mobile.png',
              'actual-sites-editor-mobile.png', 'actual-sites-inquiries-mobile.png',
              'actual-commerce-catalog-mobile.png', 'actual-commerce-order-request-mobile.png',
          }
          assert {item['file'] for item in captures} == expected
          expected_states = {
              'actual-shop-first-run.png': ('/shop/', 'today'),
              'actual-shop-today.png': ('/shop/', 'today'),
              'actual-shop-sell.png': ('/shop/', 'counter'),
              'actual-shop-order-record.png': ('/shop/', 'counter'),
              'actual-shop-orders.png': ('/shop/', 'orders'),
              'actual-shop-today-mobile.png': ('/shop/', 'today'),
              'actual-shop-sell-mobile.png': ('/shop/', 'counter'),
              'actual-shop-orders-mobile.png': ('/shop/', 'orders'),
              'actual-sites-editor.png': ('/workspaces/', '/website/'),
              'actual-sites-inquiries.png': ('/workspaces/', '/website/?view=inquiries'),
              'actual-sites-editor-mobile.png': ('/workspaces/', '/website/'),
              'actual-sites-inquiries-mobile.png': ('/workspaces/', '/website/?view=inquiries'),
              'actual-commerce-catalog.png': ('/workspaces/', '/ecommerce/?view=preview'),
              'actual-commerce-order-request.png': ('/workspaces/', '/ecommerce/?view=preview'),
              'actual-commerce-catalog-mobile.png': ('/workspaces/', '/ecommerce/?view=preview'),
              'actual-commerce-order-request-mobile.png': ('/workspaces/', '/ecommerce/?view=preview'),
          }
          for item in captures:
              expected_path, expected_route = expected_states[item['file']]
              expected_size = (390, 844) if item['file'].endswith('-mobile.png') else (1440, 900)
              assert (item['width'], item['height']) == expected_size
              assert item['fixturePath'] == expected_path
              if item['file'].startswith('actual-commerce-'):
                  actual_route = urlsplit(item['routeState'])
                  assert actual_route.path == '/ecommerce/'
                  assert parse_qs(actual_route.query).get('view') == ['preview']
              else:
                  assert item['routeState'] == expected_route
              assert item['visibleSelector']
          assert next(item for item in captures if item['file'] == 'actual-shop-order-record.png')['recordKind'] == 'paid_order_record_not_customer_receipt'
          assert next(item for item in captures if item['file'] == 'actual-sites-editor.png')['loadedImages'] >= 3
          assert next(item for item in captures if item['file'] == 'actual-commerce-catalog.png')['loadedImages'] >= 3
          source = Path(evidence['output']).resolve()
          assert source.parent == Path(os.environ['GITHUB_WORKSPACE'], '.tmp').resolve()
          assert source.name.startswith('gallery-candidate-')
          target = Path(os.environ['RUNNER_TEMP'], 'supermega-gallery-candidate')
          target.mkdir()
          for item in captures:
              path = source / item['file']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256']
              copy2(path, target / item['file'])
          copy2(report, target / 'capture.json')
          PY

      - name: Upload product gallery candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supermega-gallery-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supermega-gallery-candidate/
          if-no-files-found: error
          retention-days: 7
