name: SuperMega App CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SuperMega App CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPERMEGA_CI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        run: test "$(git rev-parse HEAD)" = "$SUPERMEGA_CI_SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Prepare PostgreSQL 17 test tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/supermega-pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-17 postgresql-client-17 openssl
          /usr/lib/postgresql/17/bin/postgres --version
          echo "SUPERMEGA_POSTGRES17_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Verify canonical API contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install migration verifier
        run: npm ci --ignore-scripts

      - name: Verify coordinated release and RLS guards
        run: |
          python tools/validate_supermega_database_url.py --self-test
          node tools/verify_private_trial_migrations.mjs
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs
          node tools/verify_public_deploy_guard.mjs
          node --test tools/verify_public_deploy_guard.test.mjs

      - name: Install dependencies
        working-directory: showroom
        run: npm ci

      - name: Lint app
        working-directory: showroom
        run: npm run lint

      - name: Generate app deployment contract
        run: node tools/write_app_vercel_config.mjs

      - name: Build and verify canonical app
        env:
          SUPERMEGA_RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: npm run app:build:checked

      - name: Verify desktop and 390px product journeys
        env:
          SUPERMEGA_RENDERED_EVIDENCE_DIR: ${{ runner.temp }}/supermega-app-entry-rendered-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tools/verify_app_entry_rendered.mjs \
            --out "$SUPERMEGA_RENDERED_EVIDENCE_DIR/report.json" \
            --screenshot-dir "$SUPERMEGA_RENDERED_EVIDENCE_DIR" \
            --expected-head "$SUPERMEGA_CI_SOURCE_SHA"
