name: SuperMega App CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: SuperMega App CI
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Verify canonical API contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install migration verifier
        run: npm ci --ignore-scripts

      - name: Verify coordinated release and RLS guards
        run: |
          python tools/validate_supermega_database_url.py --self-test
          npm run database:migrations:verify
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs
          node tools/verify_public_deploy_guard.mjs

      - name: Install dependencies
        working-directory: showroom
        run: npm ci

      - name: Lint app
        working-directory: showroom
        run: npm run lint

      - name: Generate app deployment contract
        run: node tools/write_app_vercel_config.mjs

      - name: Build and verify canonical app
        env:
          SUPERMEGA_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run app:build:checked
