name: SuperMega App CI

on:
  pull_request:
    paths:
      - 'showroom/**'
      - 'hq/**'
      - 'CURRENT.md'
      - 'api/**'
      - 'api_app.py'
      - 'supermega_runtime/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'tools/write_app_vercel_config.mjs'
      - 'tools/write_app_release_metadata.mjs'
      - 'tools/verify_app_build.mjs'
      - 'tools/verify_app_deploy_workflow.mjs'
      - 'tools/verify_app_security_contract.mjs'
      - 'tools/verify_app_release_live.mjs'
      - 'tools/verify_coordinated_release_live.mjs'
      - 'tools/verify_public_deploy_guard.mjs'
      - 'tools/verify_public_release_live.mjs'
      - 'tools/verify_hq_contract.mjs'
      - 'tools/verify_vercel_environment_state.mjs'
      - 'tools/test_vercel_environment_state.mjs'
      - 'tools/verify_vercel_domain_state.mjs'
      - 'tools/test_vercel_domain_state.mjs'
      - 'tools/validate_supermega_database_url.py'
      - 'tools/activate_supermega_database.ps1'
      - 'site-manifest.json'
      - 'package.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - '.github/workflows/supermega-app-deploy.yml'
      - '.github/workflows/supermega-public-release.yml'
      - '.github/workflows/showroom-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify canonical API contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify coordinated release and RLS guards
        run: |
          python tools/validate_supermega_database_url.py --self-test
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs
          node tools/verify_public_deploy_guard.mjs

      - name: Install dependencies
        working-directory: showroom
        run: npm ci

      - name: Lint app
        working-directory: showroom
        run: npm run lint

      - name: Generate app deployment contract
        run: node tools/write_app_vercel_config.mjs

      - name: Build and verify canonical app
        env:
          SUPERMEGA_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run app:build
