name: SuperMega App CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'showroom/**'
      - 'hq/**'
      # docs/ is drift-guarded by tools/test_demo_playbooks.mjs, which IS in the
      # app:verify chain -- but without these two entries a docs-ONLY pull request
      # matches no path here, so this workflow never triggers and the guard never
      # runs on the very change it exists to catch. The drift then surfaces on the
      # next unrelated pull request that does touch a listed path, attributed to
      # whoever opened it. Verified 2026-08-24 on PRs #554 and #556: both changed
      # only docs/ and both showed all-checks-passed with no validate run at all.
      - 'docs/**'
      - 'tools/test_demo_playbooks.mjs'
      # The browser journey below is not in the app:verify chain, so a change to it
      # alone must still trigger this workflow -- same reasoning as docs/ above.
      - 'tools/journey_shop_cash_sale.mjs'
      - 'CURRENT.md'
      - 'api/**'
      - 'api_app.py'
      - 'supermega_runtime/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'tools/write_app_vercel_config.mjs'
      - 'tools/create_public_vercel_output.mjs'
      - 'tools/verify_public_vercel_artifact_budget.mjs'
      - 'tools/verify_public_vercel_output.mjs'
      - 'tools/test_public_contact_function.mjs'
      - 'tools/supermega_scheduler_authority.json'
      - 'tools/ensure_supermega_scheduler.ps1'
      - 'tools/write_app_release_metadata.mjs'
      - 'tools/verify_app_build.mjs'
      - 'tools/verify_app_deploy_workflow.mjs'
      - 'tools/verify_app_security_contract.mjs'
      - 'tools/verify_private_trial_migrations.mjs'
      - 'tools/prepare_supabase_rehearsal_packet.mjs'
      - 'tools/prepare_supabase_rehearsal_packet.test.mjs'
      - 'tools/verify_app_release_live.mjs'
      - 'tools/verify_coordinated_release_live.mjs'
      - 'tools/verify_public_deploy_guard.mjs'
      - 'tools/serve_solution.py'
      - 'tools/run_vercel_release_gate.ps1'
      - 'tools/deploy_supermega_gcp.ps1'
      - 'tools/deploy_showroom_cloud_run.ps1'
      - 'tools/cloudrun_preflight.ps1'
      - 'tools/verify_public_release_live.mjs'
      - 'tools/verify_public_preview_live.mjs'
      - 'tools/verify_hq_contract.mjs'
      - 'tools/verify_vercel_environment_state.mjs'
      - 'tools/test_vercel_environment_state.mjs'
      - 'tools/verify_vercel_project_state.mjs'
      - 'tools/test_vercel_project_state.mjs'
      - 'tools/verify_vercel_domain_state.mjs'
      - 'tools/verify_retired_vercel_alias_state.mjs'
      - 'tools/test_vercel_domain_state.mjs'
      - 'tools/verify_public_firewall_state.mjs'
      - 'tools/resolve_vercel_rollback_target.mjs'
      - 'tools/validate_supermega_database_url.py'
      - 'tools/activate_supermega_database.ps1'
      - 'tools/rehearse_supermega_postgres17.py'
      - 'tools/run_postgres17_rehearsal.mjs'
      - 'tools/deny_stale_public_deploy.mjs'
      - 'tools/deploy_website_actions.ps1'
      - 'vercel.json'
      - '.vercelignore'
      - 'site-manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - 'requirements-test.txt'
      - '.github/workflows/supermega-app-deploy.yml'
      - '.github/workflows/supermega-public-release.yml'
      - '.github/workflows/supermega-public-live-health.yml'
      - '.github/workflows/public-hosting-guard.yml'
      - '.github/workflows/showroom-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            showroom/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Verify canonical API contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install migration verifier
        run: npm ci --ignore-scripts

      - name: Verify coordinated release and RLS guards
        run: |
          python tools/validate_supermega_database_url.py --self-test
          node tools/verify_private_trial_migrations.mjs
          node tools/verify_coordinated_release_live.mjs --self-test
          node tools/verify_app_deploy_workflow.mjs
          node tools/verify_public_deploy_guard.mjs

      - name: Install dependencies
        working-directory: showroom
        run: npm ci

      - name: Lint app
        working-directory: showroom
        run: npm run lint

      - name: Generate app deployment contract
        run: node tools/write_app_vercel_config.mjs

      - name: Build and verify canonical app
        env:
          SUPERMEGA_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run app:build:checked

      # The one automated browser end-to-end journey (ENTERPRISE-READINESS-SCORECARD §5):
      # the Shop one-tap cash sale at a 390px viewport against the showroom/dist the
      # gate above just verified, asserting on the persisted workspace record rather
      # than on pixels. Deliberately AFTER the gate so a gate failure is still the
      # first thing reported. Zero dependencies -- Node built-ins drive the runner's
      # preinstalled Chrome over the DevTools protocol (see the file header).
      - name: Shop cash-sale browser journey (390px)
        run: node tools/journey_shop_cash_sale.mjs
