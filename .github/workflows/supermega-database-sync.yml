name: Sync SuperMega Production Database Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-database-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@56.4.0

      - name: Copy approved database secret to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPERMEGA_DATABASE_URL: ${{ secrets.SUPERMEGA_DATABASE_URL }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$SUPERMEGA_DATABASE_URL"
          printf '%s' "$SUPERMEGA_DATABASE_URL" | vercel env add SUPERMEGA_DATABASE_URL production --force --sensitive --yes --project prj_1GAMPH8qlSAXno5BhO1wkYx1jkGG --token "$VERCEL_TOKEN"

      - name: Confirm variable name only
        run: echo "SUPERMEGA_DATABASE_URL is configured for the megaos production target."
