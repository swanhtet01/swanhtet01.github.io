[project]
name = "supermega-agent-solutions"
version = "0.1.0"
description = "Review-gated templates, trials, lead fit, and insight briefs for SuperMega."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-agents>=0.4,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
