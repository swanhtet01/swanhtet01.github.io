[project]
name = "supermega-runtime"
version = "1.0.0"
description = "Canonical SuperMega API runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-psycopg==0.66b1",
  "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
]

[dependency-groups]
test = [
  "httpx==0.28.1",
  "SQLAlchemy==2.0.51",
  "sqlmodel==0.0.39",
]
audit = [
  "pip-audit==2.10.1",
]
